name: 🛠️ Optimize Defconfig

on:
  workflow_dispatch:

env:
  KERNEL_DIR: kernel_source
  BOT_API: 8934276155:AAHEEXMoUt7KUXtz4MEzNuAj1K14cnIKYiI
  TELEGRAM_GROUP_ID: -1004324974450
  ACTIONS_ALLOW_USE_UNSECURE_NODE_VERSION: true

jobs:
  optimize-defconfig:
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        device: [lavender, whyred]
        branch: [PLTS, st74, st78, ksun-33024, ksun-33068, resukisu, susfs]

    steps:
      - name: Initialize Workflow
        run: echo "Starting defconfig update for ${{ matrix.device }} on branch ${{ matrix.branch }}..."

      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          repository: ExXyrou/android_san_kernel_xiaomi_sdm660
          ref: ${{ matrix.branch }}
          token: ${{ secrets.GH_PAT }}
          path: ${{ env.KERNEL_DIR }}
          fetch-depth: 0
          submodules: false

      - name: Edit Defconfig
        working-directory: ${{ env.KERNEL_DIR }}
        run: |
          if [ "${{ matrix.device }}" == "whyred" ]; then
            DEFCONFIG_FILE="arch/arm64/configs/whyred_defconfig"
          else
            DEFCONFIG_FILE="arch/arm64/configs/lavender_defconfig"
          fi

          echo "Editing $DEFCONFIG_FILE..."

          enable_config()  { ./scripts/config --file "$DEFCONFIG_FILE" --enable  "$1"; }
          disable_config() { ./scripts/config --file "$DEFCONFIG_FILE" --disable "$1"; }
          set_str()        { ./scripts/config --file "$DEFCONFIG_FILE" --set-str "$1" "$2"; }
          set_val()        { ./scripts/config --file "$DEFCONFIG_FILE" --set-val "$1" "$2"; }

          echo "Applying Performance & Stability Tweaks for SDM660..."

          # 1. Disable Heavy Tracing & Debugging (Mengurangi overhead CPU, dmesg & panic log tetap aman)
          disable_config FTRACE
          disable_config TRACING
          disable_config GENERIC_TRACER
          disable_config BRANCH_PROFILE_NONE
          disable_config CONTEXT_SWITCH_TRACER
          disable_config BLK_DEV_IO_TRACE
          disable_config TRACER_PKT
          disable_config SCHED_DEBUG
          disable_config SCHEDSTATS
          disable_config SCHED_INFO

          # 2. Disable Unnecessary MSM & SoC Stats (Mencegah micro-stutter saat transisi state CPU)
          disable_config MSM_IDLE_STATS
          disable_config MSM_BOOT_STATS
          disable_config MSM_RUN_QUEUE_STATS
          disable_config UID_SYS_STATS

          # 3. Optimize I/O Scheduler (FIOPS lebih responsif untuk eMMC dibanding CFQ)
          enable_config IOSCHED_FIOPS
          enable_config IOSCHED_SIO
          disable_config DEFAULT_CFQ
          set_str DEFAULT_IOSCHED "fiops"

          # 4. Networking Optimization (BBR untuk ping game yang lebih stabil)
          enable_config TCP_CONG_BBR
          set_str DEFAULT_TCP_CONG "bbr"

          # 5. Core Performance & EAS Guardrails (Memastikan EAS Schedutil terkunci)
          enable_config CPU_FREQ_GOV_SCHEDUTIL
          enable_config DEFAULT_USE_ENERGY_AWARE
          enable_config CC_OPTIMIZE_FOR_PERFORMANCE

          enable_config ZRAM
          enable_config ZSMALLOC
          enable_config ZRAM_LZ4_COMPRESS

          echo "All optimization configs applied to $DEFCONFIG_FILE"
          echo "DEFCONFIG_REL_PATH=$DEFCONFIG_FILE" >> $GITHUB_ENV

      - name: Commit & Push Defconfig (with retry + rebase)
        working-directory: ${{ env.KERNEL_DIR }}
        run: |
          git config user.name "${{ secrets.GH_USERNAME }}"
          git config user.email "${{ secrets.GH_EMAIL }}"

          git rm -r --cached KernelSU || true
          
          if git diff --quiet "${{ env.DEFCONFIG_REL_PATH }}"; then
            echo "No changes detected in defconfig."
            exit 0
          fi

          git add "${{ env.DEFCONFIG_REL_PATH }}"
          git commit -m "config: [Optimize] defconfig for ${{ matrix.device }} (${{ matrix.branch }})"

          git remote set-url origin https://x-access-token:${{ secrets.GH_PAT }}@github.com/ExXyrou/android_san_kernel_xiaomi_sdm660.git

          MAX_RETRY=5
          for i in $(seq 1 $MAX_RETRY); do
            echo "🔁 Push attempt $i/$MAX_RETRY..."
            if git push origin HEAD:${{ matrix.branch }}; then
              echo "✅ Push success on attempt $i"
              exit 0
            fi

            echo "⚠️ Push rejected, fetching & rebasing..."
            git fetch origin ${{ matrix.branch }}
            git rebase origin/${{ matrix.branch }} || {
              echo "⚠️ Rebase conflict, aborting"
              git rebase --abort
              git pull --rebase -X theirs origin ${{ matrix.branch }}
            }
            sleep 5
          done

          echo "❌ Push failed after $MAX_RETRY attempts"
          exit 1

  notify:
    needs: optimize-defconfig
    if: always()
    runs-on: ubuntu-22.04

    steps:
      - name: Send Telegram Notification (Final Result)
        run: |
          RESULT="${{ needs.optimize-defconfig.result }}"

          if [ "$RESULT" == "success" ]; then
            ICON="✅"
          elif [ "$RESULT" == "failure" ]; then
            ICON="❌"
          elif [ "$RESULT" == "cancelled" ]; then
            ICON="⚠️"
          else
            ICON="❓"
          fi

          MESSAGE=$(printf '%s <b>San Kernel Defconfig Optimization</b>\n\n📱 <b>Device:</b> <code>lavender, whyred</code>\n🌿 <b>Target:</b> <code>EAS 4.4 SDM660</code>\n⚙️ <b>Status:</b> <code>%s</code>\n🔧 <b>Tweaks:</b> <code>HZ=1000, Schedutil+Perf Only, TCP BBR, ZRAM LZ4</code>' "$ICON" "$RESULT")

          curl -s -X POST "https://api.telegram.org/bot${{ env.BOT_API }}/sendMessage" \
            -F chat_id="${{ env.TELEGRAM_GROUP_ID }}" \
            -F message_thread_id="345" \
            -F parse_mode="HTML" \
            -F text="$MESSAGE"
