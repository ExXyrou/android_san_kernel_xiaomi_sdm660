name: 🛠️ Push Optimize Lavender

on:
  workflow_dispatch:

env:
  KERNEL_DIR: kernel_source
  BOT_API: 8934276155:AAHEEXMoUt7KUXtz4MEzNuAj1K14cnIKYiI
  TELEGRAM_GROUP_ID: -1004324974450

jobs:
  optimize-defconfig:
    name: Optimize Defconfig (${{ matrix.branch }})
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        branch: [original-stable, kernelsu-next, resukisu, susfs]

    steps:
      - name: Initialize Workflow
        run: echo "Starting defconfig optimization for lavender on branch ${{ matrix.branch }}..."

      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          repository: ExXyrou/android_san_kernel_xiaomi_sdm660
          ref: ${{ matrix.branch }}
          token: ${{ secrets.GH_PAT }}
          path: ${{ env.KERNEL_DIR }}
          fetch-depth: 0
          submodules: false

      - name: Optimize Defconfig
        working-directory: ${{ env.KERNEL_DIR }}
        run: |
          set -euo pipefail
          DEFCONFIG_FILE="arch/arm64/configs/lavender_defconfig"
          echo "::group::Editing $DEFCONFIG_FILE"

          enable_config()  { ./scripts/config --file "$DEFCONFIG_FILE" --enable  "$1"; }
          disable_config() { ./scripts/config --file "$DEFCONFIG_FILE" --disable "$1"; }
          set_str()        { ./scripts/config --file "$DEFCONFIG_FILE" --set-str "$1" "$2"; }
          set_val()        { ./scripts/config --file "$DEFCONFIG_FILE" --set-val "$1" "$2"; }

          echo "========== MEMORY & SWAP OPTIMIZATION =========="
          # ZRAM + LZ4 (fast, low-CPU compression)
          enable_config CONFIG_SWAP
          enable_config CONFIG_ZRAM
          enable_config CONFIG_ZSMALLOC
          enable_config CONFIG_LZ4_COMPRESS
          enable_config CONFIG_CRYPTO_LZ4
          # Better page-cache reclaim decisions
          enable_config CONFIG_CLEANCACHE
          # Compressed-swap backend (harmonious with zram)
          enable_config CONFIG_FRONTSWAP
          # Keep reclaim helpers already enabled in defconfig
          enable_config CONFIG_PROCESS_RECLAIM
          enable_config CONFIG_BALANCE_ANON_FILE_RECLAIM

          echo "========== SCHEDULER OVERHEAD REDUCTION =========="
          disable_config CONFIG_SCHED_DEBUG
          disable_config CONFIG_SCHED_INFO

          echo "========== I/O TRACE OVERHEAD REDUCTION =========="
          disable_config CONFIG_BLK_DEV_IO_TRACE

          echo "========== CONFIRM PERFORMANCE DEFAULTS =========="
          # CPU governor: schedutil (EAS-friendly) + boost
          enable_config CONFIG_CPU_FREQ_DEFAULT_GOV_SCHEDUTIL
          enable_config CONFIG_CPU_BOOST
          enable_config CONFIG_DEFAULT_USE_ENERGY_AWARE
          enable_config CONFIG_SCHED_TUNE
          enable_config CONFIG_STUNE_ASSIST
          enable_config CONFIG_DYNAMIC_STUNE_BOOST

          # I/O scheduler: BFQ (responsiveness + multitasking)
          enable_config CONFIG_IOSCHED_BFQ
          enable_config CONFIG_DEFAULT_BFQ
          set_str CONFIG_DEFAULT_IOSCHED "bfq"

          # Network stack: FQ_CODEL + Westwood (gaming-friendly low latency)
          enable_config CONFIG_NET_SCH_FQ_CODEL
          enable_config CONFIG_DEFAULT_FQ_CODEL
          set_str CONFIG_DEFAULT_NET_SCH "fq_codel"
          enable_config CONFIG_DEFAULT_WESTWOOD
          set_str CONFIG_DEFAULT_TCP_CONG "westwood"

          # Build optimization
          enable_config CONFIG_CC_OPTIMIZE_FOR_PERFORMANCE

          echo "========== VERIFY CRITICAL ITEMS =========="
          for opt in CONFIG_SWAP CONFIG_ZRAM CONFIG_ZSMALLOC \
                     CONFIG_LZ4_COMPRESS CONFIG_CRYPTO_LZ4 \
                     CONFIG_CLEANCACHE CONFIG_FRONTSWAP \
                     CONFIG_IOSCHED_BFQ CONFIG_DEFAULT_BFQ \
                     CONFIG_NET_SCH_FQ_CODEL CONFIG_DEFAULT_FQ_CODEL \
                     CONFIG_DEFAULT_WESTWOOD CONFIG_CPU_BOOST \
                     CONFIG_CC_OPTIMIZE_FOR_PERFORMANCE; do
              if grep -q "^${opt}=y" "$DEFCONFIG_FILE"; then
                  echo "  ✅ $opt=y"
              else
                  echo "  ❌ MISSING: $opt"
              fi
          done
          for opt in CONFIG_SCHED_DEBUG CONFIG_SCHED_INFO CONFIG_BLK_DEV_IO_TRACE; do
              if grep -q "^# ${opt} is not set" "$DEFCONFIG_FILE"; then
                  echo "  ✅ $opt disabled"
              else
                  echo "  ⚠️  $opt still enabled"
              fi
          done

          echo "::endgroup::"
          echo "DEFCONFIG_REL_PATH=$DEFCONFIG_FILE" >> "$GITHUB_ENV"
          echo "BRANCH_NAME=${{ matrix.branch }}" >> "$GITHUB_ENV"

      - name: Commit & Push Defconfig (with retry + rebase)
        working-directory: ${{ env.KERNEL_DIR }}
        run: |
          set -euo pipefail
          git config user.name "${{ secrets.GH_USERNAME }}"
          git config user.email "${{ secrets.GH_EMAIL }}"

          # Clean accidental KernelSU tracking (safe no-op)
          git rm -r --cached KernelSU >/dev/null 2>&1 || true

          if git diff --quiet "${{ env.DEFCONFIG_REL_PATH }}"; then
            echo "ℹ️ No changes detected in defconfig."
            echo "COMMIT_SHA=none" >> "$GITHUB_ENV"
            echo "CHANGE_COUNT=0" >> "$GITHUB_ENV"
            exit 0
          fi

          git add "${{ env.DEFCONFIG_REL_PATH }}"
          git commit -m "config: [Optimize] lavendercfg for ${BRANCH_NAME} (EAS SDM660 3/4GB)"

          COMMIT_SHA=$(git rev-parse --short HEAD)
          CHANGE_COUNT=$(git show --stat --oneline HEAD | tail -1 | grep -oE '[0-9]+ insertion|[0-9]+ deletion' | paste -sd ' ' -)
          echo "COMMIT_SHA=${COMMIT_SHA}" >> "$GITHUB_ENV"
          echo "CHANGE_COUNT=${CHANGE_COUNT:-0 changes}" >> "$GITHUB_ENV"

          git remote set-url origin "https://x-access-token:${{ secrets.GH_PAT }}@github.com/ExXyrou/android_san_kernel_xiaomi_sdm660.git"
          MAX_RETRY=5
          for i in $(seq 1 $MAX_RETRY); do
            echo "🔁 Push attempt $i/$MAX_RETRY..."
            if git push origin "HEAD:${{ matrix.branch }}"; then
              echo "✅ Push success on attempt $i"
              exit 0
            fi
            echo "⚠️ Push rejected, fetching & rebasing..."
            git fetch origin "${{ matrix.branch }}"
            git rebase "origin/${{ matrix.branch }}" || {
              echo "⚠️ Rebase conflict, aborting"
              git rebase --abort
              git pull --rebase -X theirs origin "${{ matrix.branch }}"
            }
            sleep 5
          done
          echo "❌ Push failed after $MAX_RETRY attempts"
          exit 1

  notify:
    name: Notify (Telegram)
    needs: optimize-defconfig
    if: always()
    runs-on: ubuntu-22.04

    steps:
      - name: Send Telegram Notification (Final Result)
        env:
          RESULT: ${{ needs.optimize-defconfig.result }}
          JOB_MSG: ${{ needs.optimize-defconfig.outputs.job_msg }}
          BRANCH: ${{ matrix.branch }}
        run: |
          # Determine icon based on job result
          if [ "$RESULT" = "success" ]; then
            ICON="✅"
            STATUS="Success"
          elif [ "$RESULT" = "failure" ]; then
            ICON="❌"
            STATUS="Failed"
          elif [ "$RESULT" = "cancelled" ]; then
            ICON="⚠️"
            STATUS="Cancelled"
          else
            ICON="❓"
            STATUS="Unknown"
          fi

          # Note: matrix.branch is not available in this job — iterate over all branches
          BRANCHES=("original-stable" "kernelsu-next" "resukisu" "susfs")

          MESSAGE=$(cat <<EOF
${ICON} <b>San Kernel — Push Optimize Lavender</b>

📱 <b>Device:</b> <code>lavender</code> (Redmi Note 7)
🌿 <b>Kernel:</b> <code>4.4 EAS • SDM660</code>
🎯 <b>Target:</b> <code>Android 10–13 • 3/4 GB RAM</code>
⚙️ <b>Status:</b> <code>${STATUS}</code>
🌐 <b>Branches:</b> <code>${BRANCHES[*]}</code>
🔧 <b>Changes:</b> <code>Memory/ZRAM • Scheduler • I/O • Network</code>
🕐 <b>Time:</b> <code>$(date -u +'%Y-%m-%d %H:%M UTC')</code>

<i>Optimization applied via GitHub Actions</i>
EOF
)

          curl -sS -X POST "https://api.telegram.org/bot${BOT_API}/sendMessage" \
            -F "chat_id=${TELEGRAM_GROUP_ID}" \
            -F "message_thread_id=345" \
            -F "parse_mode=HTML" \
            -F "disable_web_page_preview=true" \
            -F "text=${MESSAGE}"
