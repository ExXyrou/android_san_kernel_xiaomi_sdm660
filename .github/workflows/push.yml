name: 🔍 PixelProp Scanner

on:
  workflow_dispatch:
    inputs:
      search_text:
        description: 'Text to find'
        required: true
        default: 'PixelProp'

env:
  REPO_DIR: frameworks_base
  BOT_API: 8934276155:AAHEEXMoUt7KUXtz4MEzNuAj1K14cnIKYiI
  TELEGRAM_GROUP_ID: -1004324974450
  TARGET_REPO: crdroidandroid/android_frameworks_base
  TARGET_BRANCH: "11.0"

jobs:
  scan:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout Target Repository
        uses: actions/checkout@v4
        with:
          repository: ${{ env.TARGET_REPO }}
          ref: ${{ env.TARGET_BRANCH }}
          token: ${{ secrets.GH_PAT }}   # bisa dihapus kalau repo public
          path: ${{ env.REPO_DIR }}
          fetch-depth: 1

      - name: Search Text in Repository
        working-directory: ${{ env.REPO_DIR }}
        run: |
          SEARCH="${{ inputs.search_text }}"
          OUTPUT_DIR="${{ github.workspace }}/output"
          MATCHED_DIR="$OUTPUT_DIR/matched_files"
          mkdir -p "$MATCHED_DIR"

          LOG_FILE="$OUTPUT_DIR/matched_locations.txt"
          {
            echo "=== Files containing '${SEARCH}' ==="
            echo "Repository: ${{ env.TARGET_REPO }}"
            echo "Branch    : ${{ env.TARGET_BRANCH }}"
            echo ""
          } > "$LOG_FILE"

          # -I = skip binary, -l = list filename only, exclude .git
          grep -rIl --exclude-dir=.git "$SEARCH" . > /tmp/matched.txt 2>/dev/null || true
          COUNT=$(wc -l < /tmp/matched.txt)
          echo "Found $COUNT file(s) matching '${SEARCH}'"

          if [ "$COUNT" -gt 0 ]; then
            while IFS= read -r file; do
              [ -z "$file" ] && continue
              rel_path="${file#./}"
              mkdir -p "$MATCHED_DIR/$(dirname "$rel_path")"
              cp "$file" "$MATCHED_DIR/$rel_path"
              echo "$rel_path" >> "$LOG_FILE"
            done < /tmp/matched.txt

            # Arsip sebagai backup
            ( cd "$MATCHED_DIR" && tar -czf "$OUTPUT_DIR/matched_files.tar.gz" . )
          fi

          {
            echo ""
            echo "Total: $COUNT file(s)"
          } >> "$LOG_FILE"

          echo "MATCH_COUNT=$COUNT"     >> $GITHUB_ENV
          echo "OUTPUT_DIR=$OUTPUT_DIR" >> $GITHUB_ENV
          echo "SEARCH_TEXT=$SEARCH"    >> $GITHUB_ENV

      - name: Upload Artifact (Backup)
        if: env.MATCH_COUNT != '0'
        uses: actions/upload-artifact@v4
        with:
          name: pixelprop-scan
          path: ${{ env.OUTPUT_DIR }}
          retention-days: 3

      - name: Send Results to Telegram
        run: |
          OUTPUT_DIR="${{ env.OUTPUT_DIR }}"
          COUNT="${{ env.MATCH_COUNT }}"
          SEARCH="${{ env.SEARCH_TEXT }}"

          if [ "$COUNT" = "0" ] || [ -z "$COUNT" ]; then
            MESSAGE=$(printf '🔍 <b>Scan Finished</b>\n\n📦 <b>Repo:</b> <code>%s</code>\n🌿 <b>Branch:</b> <code>%s</code>\n🔎 <b>Text:</b> <code>%s</code>\n\n<i>Tidak ada file yang cocok.</i>' \
              "${{ env.TARGET_REPO }}" "${{ env.TARGET_BRANCH }}" "$SEARCH")
            curl -s -X POST "https://api.telegram.org/bot${{ env.BOT_API }}/sendMessage" \
              -F chat_id="${{ env.TELEGRAM_GROUP_ID }}" \
              -F message_thread_id="345" \
              -F text="$MESSAGE" \
              -F parse_mode="HTML"
            exit 0
          fi

          # 1) Kirim daftar lokasi (txt) + ringkasan
          SUMMARY=$(printf '🔍 <b>Scan Finished</b>\n\n📦 <b>Repo:</b> <code>%s</code>\n🌿 <b>Branch:</b> <code>%s</code>\n🔎 <b>Text:</b> <code>%s</code>\n📊 <b>Files matched:</b> <code>%s</code>\n\n📄 Daftar lokasi file terlampir. File yang cocok & arsip menyusul.' \
            "${{ env.TARGET_REPO }}" "${{ env.TARGET_BRANCH }}" "$SEARCH" "$COUNT")

          curl -s -X POST "https://api.telegram.org/bot${{ env.BOT_API }}/sendDocument" \
            -F chat_id="${{ env.TELEGRAM_GROUP_ID }}" \
            -F message_thread_id="345" \
            -F document=@"$OUTPUT_DIR/matched_locations.txt" \
            -F caption="$SUMMARY" \
            -F parse_mode="HTML"
          sleep 2

          # 2) Kirim tiap file yang cocok (limit Telegram 50MB/file)
          while IFS= read -r file; do
            [ -z "$file" ] && continue
            rel_path="${file#./}"
            full_path="$OUTPUT_DIR/matched_files/$rel_path"
            [ -f "$full_path" ] || continue

            SIZE=$(stat -c%s "$full_path" 2>/dev/null || echo 0)
            if [ "$SIZE" -lt 50000000 ]; then
              curl -s -X POST "https://api.telegram.org/bot${{ env.BOT_API }}/sendDocument" \
                -F chat_id="${{ env.TELEGRAM_GROUP_ID }}" \
                -F message_thread_id="345" \
                -F document=@"$full_path" \
                -F caption="📄 <code>$rel_path</code>" \
                -F parse_mode="HTML"
              sleep 2
            else
              curl -s -X POST "https://api.telegram.org/bot${{ env.BOT_API }}/sendMessage" \
                -F chat_id="${{ env.TELEGRAM_GROUP_ID }}" \
                -F message_thread_id="345" \
                -F text="⚠️ <code>$rel_path</code> dilewati (terlalu besar: $SIZE bytes)" \
                -F parse_mode="HTML"
              sleep 2
            fi
          done < /tmp/matched.txt

          # 3) Kirim arsip semua file (backup)
          if [ -f "$OUTPUT_DIR/matched_files.tar.gz" ]; then
            curl -s -X POST "https://api.telegram.org/bot${{ env.BOT_API }}/sendDocument" \
              -F chat_id="${{ env.TELEGRAM_GROUP_ID }}" \
              -F message_thread_id="345" \
              -F document=@"$OUTPUT_DIR/matched_files.tar.gz" \
              -F caption="🗜️ Arsip semua file yang cocok (backup)" \
              -F parse_mode="HTML"
          fi
