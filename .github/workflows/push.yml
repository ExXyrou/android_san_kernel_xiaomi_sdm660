name: 🔧 Sync BakaSU Manual Hook (resukisu → bakasu)

on:
  workflow_dispatch:

env:
  KERNEL_DIR: kernel_source
  REPO: ExXyrou/android_san_kernel_xiaomi_sdm660
  SOURCE_BRANCH: resukisu
  TARGET_BRANCH: bakasu
  DEFCONFIG: arch/arm64/configs/lavender_defconfig
  BOT_API: 8934276155:AAHEEXMoUt7KUXtz4MEzNuAj1K14cnIKYiI
  TELEGRAM_GROUP_ID: -1004324974450
  ACTIONS_ALLOW_USE_UNSECURE_NODE_VERSION: true

jobs:
  sync-manual-hook:
    runs-on: ubuntu-22.04
    permissions:
      contents: write

    steps:
      - name: Initialize
        run: echo "Sync manual hook + defconfig from $SOURCE_BRANCH → $TARGET_BRANCH"

      - name: Checkout Target Branch (bakasu)
        uses: actions/checkout@v4
        with:
          repository: ${{ env.REPO }}
          ref: ${{ env.TARGET_BRANCH }}
          token: ${{ secrets.GH_PAT }}
          path: ${{ env.KERNEL_DIR }}
          fetch-depth: 0
          submodules: false

      - name: Fetch Source Branch (resukisu)
        working-directory: ${{ env.KERNEL_DIR }}
        run: |
          git remote set-url origin https://x-access-token:${{ secrets.GH_PAT }}@github.com/${{ env.REPO }}.git
          git fetch origin ${{ env.SOURCE_BRANCH }}
          git branch -f resukisu-src origin/${{ env.SOURCE_BRANCH }}
          echo "✅ Fetched resukisu-src"

      - name: Copy Manual Hook Files + Defconfig from resukisu
        working-directory: ${{ env.KERNEL_DIR }}
        run: |
          FILES=(
            "fs/stat.c"
            "fs/exec.c"
            "fs/open.c"
            "kernel/reboot.c"
            "kernel/sys.c"
            "drivers/input/input.c"
            "fs/read_write.c"
            "security/selinux/selinuxfs.c"
            "security/selinux/ss/status.c"
            "security/selinux/ss/services.c"
            "security/selinux/hooks.c"
            "${{ env.DEFCONFIG }}"
          )
          for f in "${FILES[@]}"; do
            echo "👉 $f"
            if git cat-file -e resukisu-src:"$f" 2>/dev/null; then
              git checkout resukisu-src -- "$f"
              echo "   ✅ replaced"
            else
              echo "   ⚠️ not found in $SOURCE_BRANCH, skipped"
            fi
          done
          echo "----- DIFF STAT -----"
          git diff --cached --stat || true

      - name: Setup BakaSU (curl setup.sh)
        working-directory: ${{ env.KERNEL_DIR }}
        run: |
          curl -LSs "https://raw.githubusercontent.com/Baka-SU/BakaSU/main/kernel/setup.sh" | bash

      - name: Commit & Push (retry + rebase)
        working-directory: ${{ env.KERNEL_DIR }}
        run: |
          git config user.name  "${{ secrets.GH_USERNAME }}"
          git config user.email "${{ secrets.GH_EMAIL }}"

          # hapus submodule KernelSU kalau nyangkut di cache
          git rm -r --cached KernelSU 2>/dev/null || true

          if git diff --cached --quiet && git diff --quiet; then
            echo "ℹ️ No changes to commit."
            exit 0
          fi

          git add -A
          git commit -m "manual-hook: sync from resukisu + BakaSU setup (bakasu)"

          git remote set-url origin https://x-access-token:${{ secrets.GH_PAT }}@github.com/${{ env.REPO }}.git

          MAX_RETRY=5
          for i in $(seq 1 $MAX_RETRY); do
            echo "🔁 Push attempt $i/$MAX_RETRY ..."
            if git push origin HEAD:${{ env.TARGET_BRANCH }}; then
              echo "✅ Push success on attempt $i"
              exit 0
            fi
            echo "⚠️ Push rejected, fetching & rebasing ..."
            git fetch origin ${{ env.TARGET_BRANCH }}
            git rebase origin/${{ env.TARGET_BRANCH }} || {
              echo "⚠️ Rebase conflict, force theirs"
              git rebase --abort
              git pull --rebase -X theirs origin ${{ env.TARGET_BRANCH }}
            }
            sleep 5
          done
          echo "❌ Push failed after $MAX_RETRY attempts"
          exit 1

  notify:
    needs: sync-manual-hook
    if: always()
    runs-on: ubuntu-22.04
    steps:
      - name: Send Telegram Notification
        run: |
          RESULT="${{ needs.sync-manual-hook.result }}"
          case "$RESULT" in
            success)   ICON="✅" ;;
            failure)   ICON="❌" ;;
            cancelled) ICON="⚠️" ;;
            *)         ICON="❓" ;;
          esac
          MESSAGE=$(printf '%s <b>BakaSU Manual Hook Sync</b>\n\n📱 <b>Device:</b> <code>lavender</code>\n📥 <b>From:</b> <code>resukisu</code>\n📤 <b>To:</b> <code>bakasu</code>\n⚙️ <b>Status:</b> <code>%s</code>\n🔧 <b>Info:</b> <code>manual-hook + defconfig + BakaSU setup</code>' "$ICON" "$RESULT")
          curl -s -X POST "https://api.telegram.org/bot${{ env.BOT_API }}/sendMessage" \
            -F chat_id="${{ env.TELEGRAM_GROUP_ID }}" \
            -F message_thread_id="345" \
            -F parse_mode="HTML" \
            -F text="$MESSAGE"
