name: 🖥️ Fix Display Flicker (Lavender)

on:
  workflow_dispatch:

env:
  KERNEL_DIR: kernel_source
  BOT_API: 8934276155:AAHEEXMoUt7KUXtz4MEzNuAj1K14cnIKYiI
  TELEGRAM_GROUP_ID: -1004324974450
  TARGET_BRANCH: test-build
  ACTIONS_ALLOW_USE_UNSECURE_NODE_VERSION: true

jobs:
  fix-display-flicker:
    runs-on: ubuntu-22.04
    permissions:
      contents: write

    steps:
      - name: Initialize Workflow
        run: echo "Starting display flicker fix for lavender on branch ${{ env.TARGET_BRANCH }}..."

      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          repository: ExXyrou/android_san_kernel_xiaomi_sdm660
          ref: ${{ env.TARGET_BRANCH }}
          token: ${{ secrets.GH_PAT }}
          path: ${{ env.KERNEL_DIR }}
          fetch-depth: 0
          submodules: false

      - name: Apply Display Flicker Fixes
        working-directory: ${{ env.KERNEL_DIR }}
        run: |
          echo "🔧 Applying display flicker fixes for lavender..."

          # 1. Update defconfig — disable problematic MDSS features, enable KCAL
          CFG="arch/arm64/configs/lavender_defconfig"
          echo "Editing $CFG..."
          scripts/config --file "$CFG" --disable CONFIG_FB_MSM_MDSS_DSI_CTRL_STATUS
          scripts/config --file "$CFG" --disable CONFIG_FB_MSM_MDSS_LPM_ENABLE
          scripts/config --file "$CFG" --disable CONFIG_FB_MSM_MDSS_MDP_IDLE_PC
          scripts/config --file "$CFG" --enable  CONFIG_FB_MSM_MDSS_KCAL_CTRL

          # 2. Patch DTSI — disable ESD check, LPM, idle-pc, ULPS, dynamic FPS
          echo "Patching DTSI files..."
          find arch/arm64/boot/dts -name '*.dtsi' -exec sed -i -E \
            -e 's/qcom,esd-check-enabled.*=.*<1>/qcom,esd-check-enabled = <0>/g' \
            -e 's/qcom,mdss-dsi-pan-enable-lpm.*=.*<1>/qcom,mdss-dsi-pan-enable-lpm = <0>/g' \
            -e 's/qcom,mdss-dsi-idle-pc-enabled.*=.*<1>/qcom,mdss-dsi-idle-pc-enabled = <0>/g' \
            -e 's/qcom,mdss-dsi-ulps-enabled.*=.*<1>/qcom,mdss-dsi-ulps-enabled = <0>/g' \
            -e 's/qcom,mdss-dsi-dynamic-fps.*=.*<1>/qcom,mdss-dsi-dynamic-fps = <0>/g' {} \;

          # 3. Patch panel driver — disable CABC, DSI status, ESD check
          echo "Patching mdss_dsi_panel.c..."
          PANEL_C=$(find drivers/video/fbdev/msm -name "mdss_dsi_panel.c")
          sed -i -E 's/(cabc_enabled|dsi_status_enabled|esd_check_enabled)[[:space:]]*=.*true/\1 = false/g' "$PANEL_C" || true

          # 4. Patch MDP — disable idle power collapse
          echo "Patching mdss_mdp.c..."
          MDP="drivers/video/fbdev/msm/mdss_mdp.c"
          sed -i -E 's/(idle_pc_enabled[[:space:]]*=).*/\1 false;/' "$MDP" || true

          # 5. Force status check to always return 0 (prevents false ESD triggers)
          echo "Patching *status*.c files..."
          STATUS_C=$(find drivers/video/fbdev/msm -name "*status*.c")
          for f in $STATUS_C; do
            if ! grep -q "mdss_dsi_panel_status_check" "$f"; then
              sed -i '1i int mdss_dsi_panel_status_check(struct mdss_panel_data *pdata){return 0;}' "$f" || true
            fi
          done

          echo "✅ All display flicker fixes applied."

      - name: Commit & Push Fixes (with retry + rebase)
        working-directory: ${{ env.KERNEL_DIR }}
        run: |
          git config user.name  "${{ secrets.GH_USERNAME }}"
          git config user.email "${{ secrets.GH_EMAIL }}"

          git add -A arch/arm64/configs/lavender_defconfig \
                    arch/arm64/boot/dts \
                    drivers/video/fbdev/msm

          if git diff --cached --quiet; then
            echo "No changes detected. Nothing to commit."
            exit 0
          fi

          git commit -m "fix(display): [lavender] prevent screen flicker & black blink (${{ env.TARGET_BRANCH }})"

          git remote set-url origin https://x-access-token:${{ secrets.GH_PAT }}@github.com/ExXyrou/android_san_kernel_xiaomi_sdm660.git

          MAX_RETRY=5
          for i in $(seq 1 $MAX_RETRY); do
            echo "🔁 Push attempt $i/$MAX_RETRY..."
            if git push origin HEAD:${{ env.TARGET_BRANCH }}; then
              echo "✅ Push success on attempt $i"
              exit 0
            fi
            echo "⚠️ Push rejected, fetching & rebasing..."
            git fetch origin ${{ env.TARGET_BRANCH }}
            git rebase origin/${{ env.TARGET_BRANCH }} || {
              echo "⚠️ Rebase conflict, aborting"
              git rebase --abort
              git pull --rebase -X theirs origin ${{ env.TARGET_BRANCH }}
            }
            sleep 5
          done
          echo "❌ Push failed after $MAX_RETRY attempts"
          exit 1

  notify:
    needs: fix-display-flicker
    if: always()
    runs-on: ubuntu-22.04

    steps:
      - name: Send Telegram Notification (Final Result)
        run: |
          RESULT="${{ needs.fix-display-flicker.result }}"
          if   [ "$RESULT" == "success"   ]; then ICON="✅"
          elif [ "$RESULT" == "failure"   ]; then ICON="❌"
          elif [ "$RESULT" == "cancelled" ]; then ICON="⚠️"
          else                                     ICON="❓"
          fi

          MESSAGE=$(printf '%s <b>San Kernel Display Fix</b>\n\n📱 <b>Device:</b> <code>lavender</code>\n🌿 <b>Target:</b> <code>EAS 4.4 SDM660</code>\n🌿 <b>Branch:</b> <code>test-build</code>\n⚙️ <b>Status:</b> <code>%s</code>\n🔧 <b>Fix:</b> <code>Screen Flicker / Black Blink</code>\n\n<b>Thnx:</b> @Arsya_S <code>for script fix kernel source</code>' "$ICON" "$RESULT")

          curl -s -X POST "https://api.telegram.org/bot${{ env.BOT_API }}/sendMessage" \
            -F chat_id="${{ env.TELEGRAM_GROUP_ID }}" \
            -F message_thread_id="345" \
            -F parse_mode="HTML" \
            -F text="$MESSAGE"
