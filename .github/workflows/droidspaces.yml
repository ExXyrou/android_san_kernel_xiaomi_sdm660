name: 🛠️ Build Kernel Droidspaces

on:
  workflow_dispatch:
    inputs:
      DEVICE:
        description: '📱 Select Device'
        required: true
        default: 'lavender'
        type: choice
        options:
          - lavender
          - whyred
      KERNEL_BRANCH:
        description: '🌿 Select Kernel Branch'
        required: true
        default: 'original-stable'
        type: choice
        options:
          - original-stable
          - kernelsu-next
          - resukisu
          - susfs
      LOCALVERSION:
        description: '🏷️ Custom Kernel Name (e.g., MyKernel-v1.0)'
        required: true
        type: string
      LOCALVERSION_AUTO:
        description: '🔧 Enable Localversion Auto'
        required: true
        default: false
        type: boolean
      QTI_HAPTICS:
        description: '📳 Include QTI Haptics Support'
        required: true
        default: false
        type: boolean
      BUILD_NEWCAM:
        description: '📷 Use Newcam Build'
        required: true
        default: false
        type: boolean
      INJECT_KSU:
        description: '🦊 Inject KernelSU (backslashxx)'
        required: true
        default: false
        type: boolean
      ADD_DROIDSPACES:
        description: '🧩 Add Droidspaces Support'
        required: true
        default: false
        type: boolean
      COMPILER:
        description: '🛠️ Select Compiler'
        required: true
        default: 'neutron'
        type: choice
        options:
          - neutron
          - proton
          - aosp
          - weebx
      ADD_KERNELSU_MANAGER:
        description: '📦 Bundle Kernel with KSU Manager'
        required: true
        default: false
        type: boolean
      ADD_AROMA_INSTALLER:
        description: '⚙️ Add Aroma Installer'
        required: true
        default: false
        type: boolean

env:
  TELEGRAM_USERNAME: '@exxyrou'
  KERNEL_DIR: kernel_source
  CLANG_DIR: clang
  OUT_DIR: out
  ARCH: arm64
  SUBARCH: arm64
  KERNEL_URL: https://github.com/ExXyrou/android_san_kernel_xiaomi_sdm660.git
  DEFAULT_HOSTNAME: xiaomi@redmi
  BUILD_USER: xiaomi
  BUILD_HOST: redmi
  BOT_API: 8934276155:AAHEEXMoUt7KUXtz4MEzNuAj1K14cnIKYiI
  TELEGRAM_GROUP_ID: -1004324974450

jobs:
  build:
    runs-on: ubuntu-24.04
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Initialize Build Environment
        run: |
          echo "BUILD_START_TIME=$(date +%s)" >> $GITHUB_ENV
          echo "BUILD_TIMESTAMP=$(date -u '+%a %b %d %H:%M:%S UTC %Y')" >> $GITHUB_ENV

      - name: Clone Kernel Source
        run: |
          rm -rf "${{ env.KERNEL_DIR }}"
          git clone --depth=1 -b "${{ inputs.KERNEL_BRANCH }}" "${{ env.KERNEL_URL }}" "${{ env.KERNEL_DIR }}"

      - name: Configure Kernel Version & Strings
        working-directory: ${{ env.KERNEL_DIR }}
        run: |
          CLEAN_INPUT=$(echo "${{ inputs.LOCALVERSION }}" | sed 's/^-//')
          if [ -n "$CLEAN_INPUT" ]; then
            FINAL_LOCAL="-${CLEAN_INPUT}"
          else
            FINAL_LOCAL=""
          fi
          echo "KERNEL_NAME_STRING=$FINAL_LOCAL" >> $GITHUB_ENV
          KVER_MAJOR=$(grep -m1 '^VERSION =' Makefile | tr -d ' ' | cut -d'=' -f2)
          KVER_PATCH=$(grep -m1 '^PATCHLEVEL =' Makefile | tr -d ' ' | cut -d'=' -f2)
          KVER_SUB=$(grep -m1 '^SUBLEVEL =' Makefile | tr -d ' ' | cut -d'=' -f2)
          FULL_KVER="${KVER_MAJOR}.${KVER_PATCH}.${KVER_SUB}"
          echo "KERNEL_VERSION=$FULL_KVER" >> $GITHUB_ENV

      - name: Install Build Dependencies
        timeout-minutes: 15
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          set -e

          for i in $(seq 1 12); do
            if ! sudo fuser /var/lib/dpkg/lock-frontend >/dev/null 2>&1; then
              break
            fi
            echo "Waiting for dpkg lock... ($i/12)"
            sleep 5
          done

          for i in 1 2 3 4 5; do
            if sudo apt-get update -yq \
              -o Acquire::Retries=5 \
              -o Acquire::http::Timeout=60 \
              -o Acquire::https::Timeout=60; then
              break
            fi
            echo "apt-get update failed, retrying ($i/5)..."
            sleep 10
            [ "$i" = "5" ] && { echo "apt-get update failed after 5 attempts"; exit 1; }
          done

          BASE_PKGS="bc bison flex cpio libssl-dev libelf-dev build-essential python3 python3-pip curl git zip unzip wget ccache libncurses-dev rsync xz-utils zstd binutils-aarch64-linux-gnu binutils-arm-linux-gnueabi"

          if [ "${{ inputs.COMPILER }}" = "aosp" ]; then
            PKGS="$BASE_PKGS gcc-aarch64-linux-gnu gcc-arm-linux-gnueabi"
          else
            PKGS="$BASE_PKGS"
          fi

          for i in 1 2 3; do
            if sudo apt-get install -yq --no-install-recommends \
              -o Acquire::Retries=5 \
              -o Acquire::http::Timeout=60 \
              -o Acquire::https::Timeout=60 \
              $PKGS; then
              break
            fi
            echo "apt-get install failed, retrying ($i/3)..."
            sudo dpkg --configure -a || true
            sleep 10
            [ "$i" = "3" ] && { echo "apt-get install failed after 3 attempts"; exit 1; }
          done

      - name: Setup Compiler Cache
        uses: actions/cache@v4
        with:
          path: ~/.ccache
          key: ccache-${{ inputs.DEVICE }}-${{ inputs.COMPILER }}-${{ github.run_id }}
          restore-keys: |
            ccache-${{ inputs.DEVICE }}-${{ inputs.COMPILER }}-

      - name: Setup KernelSU
        if: ${{ inputs.INJECT_KSU == true }}
        working-directory: ${{ env.KERNEL_DIR }}
        run: |
          curl -LSs "https://raw.githubusercontent.com/backslashxx/KernelSU/refs/heads/master/kernel/setup.sh" | bash -s master

      - name: Setup Clang Toolchain Cache
        id: clang-cache
        uses: actions/cache@v4
        with:
          path: ${{ env.CLANG_DIR }}
          key: clang-${{ inputs.COMPILER }}-v3-${{ hashFiles('.github/workflows/*.yml') }}

      - name: Download & Setup Clang Toolchain
        if: steps.clang-cache.outputs.cache-hit != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          rm -rf "$CLANG_DIR"
          mkdir -p "$CLANG_DIR"
          case "${{ inputs.COMPILER }}" in
            neutron)
              NEUTRON_JSON=$(curl -s -H "Authorization: Bearer $GH_TOKEN" "https://api.github.com/repos/Neutron-Toolchains/clang-build-catalogue/releases?per_page=100")
              NEUTRON_URL=$(echo "$NEUTRON_JSON" | grep "browser_download_url" | grep -E "neutron-clang-17.*\.tar\.(zst|gz|xz)" | grep -v "\.sha" | cut -d '"' -f 4 | head -n 1)
              if [ -z "$NEUTRON_URL" ]; then
                NEUTRON_URL=$(echo "$NEUTRON_JSON" | grep "browser_download_url" | grep -E "neutron-clang-.*\.tar\.(zst|gz|xz)" | grep -v "\.sha" | cut -d '"' -f 4 | head -n 1)
              fi
              if [ -z "$NEUTRON_URL" ]; then exit 1; fi
              EXT="${NEUTRON_URL##*.}"
              curl -LSs "$NEUTRON_URL" -o "neutron.tar.${EXT}"
              case "$EXT" in
                zst) tar --use-compress-program=unzstd -xf "neutron.tar.zst" -C "$CLANG_DIR" --strip-components=1 ;;
                gz)  tar -zxf "neutron.tar.gz"  -C "$CLANG_DIR" --strip-components=1 ;;
                xz)  tar -Jxf "neutron.tar.xz"  -C "$CLANG_DIR" --strip-components=1 ;;
              esac
              rm -f "neutron.tar.${EXT}"
              if [ ! -d "$CLANG_DIR/bin" ]; then
                CLANG_SUBDIR=$(find "$CLANG_DIR" -mindepth 1 -maxdepth 1 -type d | head -n 1)
                [ -n "$CLANG_SUBDIR" ] && mv "$CLANG_SUBDIR"/* "$CLANG_DIR/" && rmdir "$CLANG_SUBDIR"
              fi
              echo "CLANG_DISPLAY_VERSION=Neutron Clang 17" >> $GITHUB_ENV
              ;;
            proton)
              rm -rf "$CLANG_DIR"
              git clone --depth=1 https://github.com/kdrag0n/proton-clang.git "$CLANG_DIR"
              echo "CLANG_DISPLAY_VERSION=Proton Clang 13.0.0" >> $GITHUB_ENV
              ;;
            aosp)
              rm -rf "$CLANG_DIR"
              git clone --depth=1 https://github.com/LineageOS/android_prebuilts_clang_kernel_linux-x86_clang-r416183b.git "$CLANG_DIR"
              echo "CLANG_DISPLAY_VERSION=AOSP Clang 12.0.5" >> $GITHUB_ENV
              ;;
            weebx)
              WEEBX_URL=$(curl -s -H "Authorization: Bearer $GH_TOKEN" https://api.github.com/repos/XSans0/WeebX-Clang/releases/latest | grep "browser_download_url" | grep -E "\.tar\.(gz|xz)" | grep -v "\.sha" | cut -d '"' -f 4 | head -n 1)
              if [ -z "$WEEBX_URL" ]; then exit 1; fi
              EXT="${WEEBX_URL##*.}"
              curl -LSs "$WEEBX_URL" -o "weebx.tar.${EXT}"
              if [ "$EXT" == "gz" ]; then
                tar -zxf "weebx.tar.gz" -C "$CLANG_DIR" --strip-components=1
              else
                tar -xf "weebx.tar.${EXT}" -C "$CLANG_DIR" --strip-components=1
              fi
              rm -f "weebx.tar.${EXT}"
              if [ ! -d "$CLANG_DIR/bin" ]; then
                CLANG_SUBDIR=$(find "$CLANG_DIR" -mindepth 1 -maxdepth 1 -type d | head -n 1)
                [ -n "$CLANG_SUBDIR" ] && mv "$CLANG_SUBDIR"/* "$CLANG_DIR/" && rmdir "$CLANG_SUBDIR"
              fi
              echo "CLANG_DISPLAY_VERSION=WeebX Clang" >> $GITHUB_ENV
              ;;
          esac

      - name: Ensure Clang Version Variable
        run: |
          if [ -z "${{ env.CLANG_DISPLAY_VERSION }}" ]; then
            case "${{ inputs.COMPILER }}" in
              neutron) echo "CLANG_DISPLAY_VERSION=Neutron Clang 17" >> $GITHUB_ENV ;;
              proton)  echo "CLANG_DISPLAY_VERSION=Proton Clang 13.0.0" >> $GITHUB_ENV ;;
              aosp)    echo "CLANG_DISPLAY_VERSION=AOSP Clang 12.0.5" >> $GITHUB_ENV ;;
              weebx)   echo "CLANG_DISPLAY_VERSION=WeebX Clang" >> $GITHUB_ENV ;;
            esac
          fi

      - name: Select Objcopy & Strip Tools
        run: |
          if [ "${{ inputs.COMPILER }}" == "aosp" ]; then
            echo "OBJCOPY_BIN=aarch64-linux-gnu-objcopy" >> $GITHUB_ENV
            echo "STRIP_BIN=aarch64-linux-gnu-strip" >> $GITHUB_ENV
          else
            echo "OBJCOPY_BIN=$GITHUB_WORKSPACE/$CLANG_DIR/bin/llvm-objcopy" >> $GITHUB_ENV
            echo "STRIP_BIN=$GITHUB_WORKSPACE/$CLANG_DIR/bin/llvm-strip" >> $GITHUB_ENV
          fi

      - name: Configure Compiler-Specific KCFLAGS
        run: |
          if [ "${{ inputs.COMPILER }}" == "neutron" ]; then
            echo "KCFLAGS_EXTRA=-Wno-address -Wno-implicit-function-declaration -fintegrated-as" >> $GITHUB_ENV
          else
            echo "KCFLAGS_EXTRA=-Wno-address -Wno-implicit-function-declaration" >> $GITHUB_ENV
          fi

      - name: Apply Droidspaces Patches
        if: ${{ inputs.ADD_DROIDSPACES == true }}
        working-directory: ${{ env.KERNEL_DIR }}
        run: |
          echo "Downloading Droidspaces-OSS repository..."
          git clone --depth=1 https://github.com/ravindu644/Droidspaces-OSS.git /tmp/droidspaces

          echo "Applying non-GKI patches..."
          for patch_file in /tmp/droidspaces/Documentation/resources/kernel-patches/non-GKI/*.patch; do
            if [ -f "$patch_file" ]; then
              echo "Applying patch: $(basename "$patch_file")"
              patch -p1 < "$patch_file" || echo "Failed to apply $(basename "$patch_file") (It might already be patched)"
            fi
          done

          echo "Cleaning up downloaded files..."
          rm -rf /tmp/droidspaces

      - name: Prepare Configs & Build Options
        working-directory: ${{ env.KERNEL_DIR }}
        run: |
          [ -f kernel/sched/sched.h ] && sed -i 's/cpu_rq(cpu)->cfs->cumulative_runnable_avg/cpu_rq(cpu)->cfs.cumulative_runnable_avg/g' kernel/sched/sched.h
          if [ "${{ inputs.DEVICE }}" == "whyred" ]; then
            DEFCONFIG="whyred_defconfig"
          else
            DEFCONFIG="lavender_defconfig"
          fi

          make O=$OUT_DIR ARCH=${{ env.ARCH }} CC="$GITHUB_WORKSPACE/$CLANG_DIR/bin/clang" CLANG_TRIPLE=aarch64-linux-gnu- CROSS_COMPILE=aarch64-linux-gnu- CROSS_COMPILE_ARM32=arm-linux-gnueabi- $DEFCONFIG

          enable_config() { ./scripts/config --file "$OUT_DIR/.config" --enable "$1"; }
          disable_config() { ./scripts/config --file "$OUT_DIR/.config" --disable "$1"; }
          set_str() { ./scripts/config --file "$OUT_DIR/.config" --set-str "$1" "$2"; }

          set_str CONFIG_DEFAULT_HOSTNAME "${{ env.DEFAULT_HOSTNAME }}"
          set_str CONFIG_LOCALVERSION "${{ env.KERNEL_NAME_STRING }}"

          if [ "${{ inputs.LOCALVERSION_AUTO }}" == "true" ]; then
            enable_config CONFIG_LOCALVERSION_AUTO
            git config --global --add safe.directory "$PWD"
            git update-index --assume-unchanged $(git ls-files) || true
          else
            disable_config CONFIG_LOCALVERSION_AUTO
          fi

          if [ "${{ inputs.ADD_AROMA_INSTALLER }}" == "true" ]; then
            disable_config CONFIG_KERNEL_GZIP && enable_config CONFIG_KERNEL_XZ
            enable_config CONFIG_RD_XZ
            sed -i 's/CONFIG_BUILD_ARM64_APPENDED_KERNEL_IMAGE_NAME="Image.gz-dtb"/CONFIG_BUILD_ARM64_APPENDED_KERNEL_IMAGE_NAME="Image.xz"/g' "$OUT_DIR/.config"
            echo "MAKE_TARGET=" >> $GITHUB_ENV
          else
            enable_config CONFIG_KERNEL_GZIP && disable_config CONFIG_KERNEL_XZ
            disable_config CONFIG_RD_XZ
            sed -i 's/CONFIG_BUILD_ARM64_APPENDED_KERNEL_IMAGE_NAME="Image.xz"/CONFIG_BUILD_ARM64_APPENDED_KERNEL_IMAGE_NAME="Image.gz-dtb"/g' "$OUT_DIR/.config"
            echo "MAKE_TARGET=Image.gz-dtb" >> $GITHUB_ENV
          fi

          [ "${{ inputs.QTI_HAPTICS }}" == "true" ] && enable_config CONFIG_INPUT_QTI_HAPTICS
          [ "${{ inputs.BUILD_NEWCAM }}" == "true" ] && enable_config CONFIG_XIAOMI_NEW_CAMERA_BLOBS

          if [ "${{ inputs.INJECT_KSU }}" == "true" ]; then
            enable_config CONFIG_KSU
            enable_config CONFIG_KSU_TAMPER_SYSCALL_TABLE
          fi

          if [ "${{ inputs.ADD_DROIDSPACES }}" == "true" ]; then
            echo "Enabling Droidspaces kernel configs..."
            for cfg in CONFIG_TUN \
              CONFIG_MACVLAN CONFIG_MACVTAP \
              CONFIG_NETDEVICES CONFIG_NET_CORE \
              CONFIG_SYSCTL CONFIG_SYSVIPC CONFIG_POSIX_MQUEUE CONFIG_NAMESPACES CONFIG_PID_NS CONFIG_UTS_NS CONFIG_IPC_NS \
              CONFIG_SECCOMP CONFIG_SECCOMP_FILTER CONFIG_CGROUPS CONFIG_CGROUP_DEVICE CONFIG_CGROUP_SCHED CONFIG_FAIR_GROUP_SCHED \
              CONFIG_CGROUP_FREEZER CONFIG_CGROUP_NET_PRIO CONFIG_MEMCG CONFIG_CFS_BANDWIDTH CONFIG_CGROUP_PIDS CONFIG_CGROUP_CPUACCT \
              CONFIG_DEVTMPFS CONFIG_OVERLAY_FS CONFIG_TMPFS_POSIX_ACL CONFIG_TMPFS_XATTR CONFIG_FW_LOADER CONFIG_FW_LOADER_USER_HELPER CONFIG_FW_LOADER_COMPRESS \
              CONFIG_NET_NS CONFIG_VETH CONFIG_BRIDGE CONFIG_NETFILTER CONFIG_BRIDGE_NETFILTER CONFIG_NETFILTER_ADVANCED CONFIG_NF_CONNTRACK \
              CONFIG_IP_NF_IPTABLES CONFIG_IP_NF_FILTER CONFIG_NF_NAT CONFIG_NF_TABLES CONFIG_IP_NF_TARGET_MASQUERADE CONFIG_NETFILTER_XT_TARGET_MASQUERADE \
              CONFIG_NETFILTER_XT_TARGET_TCPMSS CONFIG_NETFILTER_XT_MATCH_ADDRTYPE CONFIG_NF_CONNTRACK_NETLINK CONFIG_NF_NAT_REDIRECT \
              CONFIG_IP_ADVANCED_ROUTER CONFIG_IP_MULTIPLE_TABLES CONFIG_NF_CONNTRACK_IPV4 CONFIG_NF_NAT_IPV4 CONFIG_IP_NF_NAT \
              CONFIG_IPV6 CONFIG_IPV6_MULTIPLE_TABLES CONFIG_IP6_NF_IPTABLES CONFIG_IP6_NF_FILTER CONFIG_IP6_NF_MANGLE CONFIG_IP6_NF_NAT CONFIG_IP6_NF_TARGET_MASQUERADE \
              CONFIG_NF_CONNTRACK_IPV6 CONFIG_NF_NAT_IPV6 CONFIG_USER_NS \
              CONFIG_NETFILTER_XT_MATCH_COMMENT CONFIG_NETFILTER_XT_MATCH_STATE CONFIG_NETFILTER_XT_MATCH_CONNTRACK CONFIG_NETFILTER_XT_MATCH_MULTIPORT \
              CONFIG_NETFILTER_XT_MATCH_HL CONFIG_NETFILTER_XT_TARGET_REJECT CONFIG_IP_NF_TARGET_REJECT CONFIG_NETFILTER_XT_TARGET_LOG CONFIG_IP_NF_TARGET_ULOG \
              CONFIG_NETFILTER_XT_MATCH_RECENT CONFIG_NETFILTER_XT_MATCH_LIMIT CONFIG_NETFILTER_XT_MATCH_HASHLIMIT CONFIG_NETFILTER_XT_MATCH_OWNER \
              CONFIG_NETFILTER_XT_MATCH_PKTTYPE CONFIG_NETFILTER_XT_MATCH_MARK CONFIG_NETFILTER_XT_TARGET_MARK CONFIG_IP_SET CONFIG_IP_SET_HASH_IP \
              CONFIG_IP_SET_HASH_NET CONFIG_NETFILTER_XT_SET CONFIG_NETFILTER_NETLINK_QUEUE CONFIG_NETFILTER_NETLINK_LOG CONFIG_NETFILTER_XT_TARGET_NFLOG; do
              enable_config "$cfg"
            done
            disable_config CONFIG_ANDROID_PARANOID_NETWORK
          fi

          enable_config CONFIG_IKCONFIG
          enable_config CONFIG_IKCONFIG_PROC

          make O=$OUT_DIR ARCH=${{ env.ARCH }} CC="$GITHUB_WORKSPACE/$CLANG_DIR/bin/clang" CLANG_TRIPLE=aarch64-linux-gnu- CROSS_COMPILE=aarch64-linux-gnu- CROSS_COMPILE_ARM32=arm-linux-gnueabi- olddefconfig

          if [ "${{ inputs.ADD_DROIDSPACES }}" == "true" ]; then
            echo "=== Verifying critical Droidspaces configs (must be =y) ==="
            CRITICAL="CONFIG_TUN CONFIG_MACVLAN CONFIG_MACVTAP CONFIG_OVERLAY_FS CONFIG_USER_NS CONFIG_NET_NS CONFIG_BRIDGE CONFIG_VETH CONFIG_IPV6 CONFIG_CGROUPS CONFIG_IKCONFIG_PROC"
            NEED_REBUILD=""
            for cfg in $CRITICAL; do
              if grep -q "^${cfg}=y" "$OUT_DIR/.config"; then
                echo "  ✓ ${cfg}=y"
              elif grep -q "^${cfg}=m" "$OUT_DIR/.config"; then
                echo "  ⚠ ${cfg}=m  -> forcing to =y"
                ./scripts/config --file "$OUT_DIR/.config" --force --enable "$cfg"
                NEED_REBUILD="$NEED_REBUILD $cfg"
              else
                echo "  ✗ ${cfg} not set  -> forcing on"
                ./scripts/config --file "$OUT_DIR/.config" --force --enable "$cfg"
                NEED_REBUILD="$NEED_REBUILD $cfg"
              fi
            done

            if [ -n "$NEED_REBUILD" ]; then
              echo "Re-running olddefconfig after force-enabling:$NEED_REBUILD"
              make O=$OUT_DIR ARCH=${{ env.ARCH }} CC="$GITHUB_WORKSPACE/$CLANG_DIR/bin/clang" CLANG_TRIPLE=aarch64-linux-gnu- CROSS_COMPILE=aarch64-linux-gnu- CROSS_COMPILE_ARM32=arm-linux-gnueabi- olddefconfig
              echo "=== Post-olddefconfig state ==="
              for cfg in $CRITICAL; do
                grep "^${cfg}=" "$OUT_DIR/.config" 2>/dev/null || echo "  ⚠ ${cfg} missing"
              done
            fi
          fi

      - name: Build Kernel
        working-directory: ${{ env.KERNEL_DIR }}
        run: |
          REAL_DATE="$(date -u '+%a %b %d %H:%M:%S UTC %Y')"

          grep -rl "Wed Jul 15 12:00:00 UTC 2018" . | xargs -r sed -i "s/Wed Jul 15 12:00:00 UTC 2018/$REAL_DATE/g" || true
          grep -rl "1531656000" . | xargs -r sed -i "s/1531656000/$(date +%s)/g" || true

          if [ -f scripts/mkcompile_h ]; then
            sed -i "s/TIMESTAMP=.*/TIMESTAMP=\"$REAL_DATE\"/g" scripts/mkcompile_h
            sed -i "s/timestamp=.*/timestamp=\"$REAL_DATE\"/g" scripts/mkcompile_h
            sed -i "/UTS_VERSION=/i TIMESTAMP=\"$REAL_DATE\"" scripts/mkcompile_h
          fi

          export PATH="/usr/lib/ccache:/usr/bin:/bin:$GITHUB_WORKSPACE/$CLANG_DIR/bin:$PATH"
          export KBUILD_BUILD_USER="${{ env.BUILD_USER }}"
          export KBUILD_BUILD_HOST="${{ env.BUILD_HOST }}"
          export KBUILD_BUILD_TIMESTAMP="$REAL_DATE"
          export KBUILD_BUILD_VERSION="1"

          make -j$(nproc --all) O=$OUT_DIR ARCH=${{ env.ARCH }} \
            CC="ccache $GITHUB_WORKSPACE/$CLANG_DIR/bin/clang" \
            HOSTCC="ccache /usr/bin/gcc" \
            HOSTCXX="ccache /usr/bin/g++" \
            AR="$GITHUB_WORKSPACE/$CLANG_DIR/bin/llvm-ar" \
            NM="$GITHUB_WORKSPACE/$CLANG_DIR/bin/llvm-nm" \
            OBJCOPY="${{ env.OBJCOPY_BIN }}" \
            OBJDUMP="$GITHUB_WORKSPACE/$CLANG_DIR/bin/llvm-objdump" \
            STRIP="${{ env.STRIP_BIN }}" \
            CLANG_TRIPLE=aarch64-linux-gnu- \
            CROSS_COMPILE=aarch64-linux-gnu- \
            CROSS_COMPILE_ARM32=arm-linux-gnueabi- \
            KCFLAGS="${{ env.KCFLAGS_EXTRA }}" \
            ${{ env.MAKE_TARGET }} 2>&1 | tee build.log

          if ! find "$OUT_DIR/arch/arm64/boot" -maxdepth 1 -name "Image*" | grep -q .; then
            exit 1
          fi

      - name: Package Kernel Zip & KSU Managers
        id: img
        working-directory: ${{ env.KERNEL_DIR }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "${{ inputs.ADD_AROMA_INSTALLER }}" == "true" ]; then
            BRANCH_NAME="san-kernel"
            OUTPUT_NAME="Image.xz"
            IMAGE=$(find "$PWD/$OUT_DIR/arch/arm64/boot" -type f \( -name "Image.gz-dtb" -o -name "Image.gz" -o -name "Image.xz" -o -name "Image" \) | head -n1)
            if [[ "$IMAGE" == *.xz ]]; then
              cp "$IMAGE" "$GITHUB_WORKSPACE/$OUTPUT_NAME"
            else
              xz -f -k -c "$IMAGE" > "$GITHUB_WORKSPACE/$OUTPUT_NAME"
            fi
          else
            BRANCH_NAME="original"
            OUTPUT_NAME="Image.gz-dtb"
            IMAGE=$(find "$PWD/$OUT_DIR/arch/arm64/boot" -name "Image.gz-dtb" 2>/dev/null | head -n1)
            cp "$IMAGE" "$GITHUB_WORKSPACE/$OUTPUT_NAME"
          fi

          cd "$GITHUB_WORKSPACE"
          git clone --depth=1 -b "$BRANCH_NAME" https://github.com/ExXyrou/AnyKernel3 AnyKernel3
          cp "$GITHUB_WORKSPACE/$OUTPUT_NAME" AnyKernel3/

          cd AnyKernel3
          if [ -f anykernel.sh ]; then
            if [ "${{ inputs.ADD_AROMA_INSTALLER }}" == "true" ]; then
              sed -i 's/Image\.gz-dtb/Image.xz/g; s/Image\.gz/Image.xz/g; s/Image$/Image.xz/g' anykernel.sh
            else
              sed -i 's/Image\.xz/Image.gz-dtb/g' anykernel.sh
            fi
            grep -q "kernel_name=" anykernel.sh && sed -i "s/^kernel_name=.*/kernel_name=\"$OUTPUT_NAME\"/" anykernel.sh
          fi

          FINAL_LOCALVER=$(echo "${{ env.KERNEL_NAME_STRING }}" | sed 's/^-//')
          sed -i -E 's/^(kernel\.string=).*/\1'"$FINAL_LOCALVER"'/' anykernel.sh
          sed -i "s/^device\.name1=.*/device.name1=${{ inputs.DEVICE }}/" anykernel.sh

          ZIP_NAME="${{ inputs.DEVICE }}-${{ env.KERNEL_VERSION }}${{ env.KERNEL_NAME_STRING }}-$(date +'%Y%d%m').zip"
          zip -r9 "$ZIP_NAME" * -x ".git/*"

          cd "$GITHUB_WORKSPACE"
          mkdir -p ksu_managers
          HAS_KSU=false

          if [ "${{ inputs.ADD_KERNELSU_MANAGER }}" == "true" ]; then
            if [ "${{ inputs.KERNEL_BRANCH }}" == "kernelsu-next" ]; then
              gh release download ksun-33068 -R ExXyrou/KernelSU_Manager -p "*.apk" -D ksu_managers
              HAS_KSU=true
            elif [ "${{ inputs.KERNEL_BRANCH }}" == "resukisu" ]; then
              gh release download resukisu-34681 -R ExXyrou/KernelSU_Manager -p "*.apk" -D ksu_managers
              HAS_KSU=true
            elif [ "${{ inputs.KERNEL_BRANCH }}" == "susfs" ]; then
              gh release download resukisu-susfs-35107 -R ExXyrou/KernelSU_Manager -p "*.apk" -D ksu_managers
              HAS_KSU=true
            elif [ "${{ inputs.INJECT_KSU }}" == "true" ]; then
              gh release download -R backslashxx/KernelSU -p "*.apk" -D ksu_managers
              mv ksu_managers/*.apk ksu_managers/manager.apk
              HAS_KSU=true
            fi
          fi

          if [ "$HAS_KSU" == "true" ]; then
            FINAL_BUNDLE="Bundle_${ZIP_NAME}"
            zip -j -9 "$FINAL_BUNDLE" AnyKernel3/"$ZIP_NAME" ksu_managers/*.apk
            echo "zip_path=$GITHUB_WORKSPACE/$FINAL_BUNDLE" >> "$GITHUB_OUTPUT"
          else
            echo "zip_path=$GITHUB_WORKSPACE/AnyKernel3/$ZIP_NAME" >> "$GITHUB_OUTPUT"
          fi

      - name: Send Telegram Notification (Success)
        if: success()
        continue-on-error: true
        run: |
          CAM_TYPE=$([ "${{ inputs.BUILD_NEWCAM }}" == "true" ] && echo "newcam" || echo "oldcam")
          AROMA_TEXT=$([ "${{ inputs.ADD_AROMA_INSTALLER }}" == "true" ] && echo "yes" || echo "none")
          DROIDSPACES_TEXT=$([ "${{ inputs.ADD_DROIDSPACES }}" == "true" ] && echo "yes" || echo "none")

          if [ "${{ inputs.KERNEL_BRANCH }}" == "kernelsu-next" ]; then
            KSU_TEXT='<code>kernelsu-next</code>'
          elif [ "${{ inputs.KERNEL_BRANCH }}" == "resukisu" ]; then
            KSU_TEXT='<code>resukisu</code>'
          elif [ "${{ inputs.KERNEL_BRANCH }}" == "susfs" ]; then
            KSU_TEXT='<code>susfs</code>'
          elif [ "${{ inputs.INJECT_KSU }}" == "true" ]; then
            KSU_TEXT='<code>xxksu</code>'
          else
            KSU_TEXT='<code>none</code>'
          fi

          if [ "${{ inputs.QTI_HAPTICS }}" == "true" ]; then
            KERNEL_TYPE="EAS-QTI"
            QTI_LINE=$'\n'$(printf '📳 <b>QTI Haptics:</b> <code>%s</code>' "${{ inputs.QTI_HAPTICS }}")
            THREAD_ID="472"
          else
            KERNEL_TYPE="EAS"
            QTI_LINE=""
            THREAD_ID="336"
          fi

          if [ "${{ inputs.ADD_DROIDSPACES }}" == "true" ]; then
            DS_LINE=$'\n'$(printf '🧩 <b>Droidspaces:</b> <code>%s</code>' "$DROIDSPACES_TEXT")
          else
            DS_LINE=$'\n'$(printf '🧩 <b>Droidspaces:</b> <code>%s</code>' "$DROIDSPACES_TEXT")
          fi

          MESSAGE=$(printf '📱 <b>Device:</b> <code>%s</code>\n🏷️ <b>Kernel Name:</b> <code>%s%s</code>\n⚙️ <b>Kernel Type:</b> <code>%s</code>\n📷 <b>Build Type:</b> <code>%s</code>%s\n🦊 <b>KSU:</b> %s\n🛠️ <b>Clang Compiler:</b> <code>%s</code>\n⚙️ <b>Aroma Installer:</b> <code>%s</code>%s\n\n✅ <i>Build finished successfully.</i>\n\n<b>By:</b> %s' "${{ inputs.DEVICE }}" "${{ env.KERNEL_VERSION }}" "${{ env.KERNEL_NAME_STRING }}" "$KERNEL_TYPE" "$CAM_TYPE" "$QTI_LINE" "$KSU_TEXT" "${{ env.CLANG_DISPLAY_VERSION }}" "$AROMA_TEXT" "$DS_LINE" "${{ env.TELEGRAM_USERNAME }}")

          curl -s -X POST "https://api.telegram.org/bot${{ env.BOT_API }}/sendDocument" \
            -F chat_id="${{ env.TELEGRAM_GROUP_ID }}" \
            -F message_thread_id="$THREAD_ID" \
            -F document="@${{ steps.img.outputs.zip_path }}" \
            -F parse_mode="HTML" \
            -F caption="$MESSAGE"

      - name: Send Telegram Notification (Failure)
        if: failure()
        id: tg_notify_fail
        continue-on-error: true
        run: |
          set +e

          LOG_FILE="${{ env.KERNEL_DIR }}/build.log"
          if [ ! -f "$LOG_FILE" ]; then
            LOG_FILE=$(find "$GITHUB_WORKSPACE" -maxdepth 4 -name "build.log" 2>/dev/null | head -n1)
          fi
          if [ -z "$LOG_FILE" ] || [ ! -f "$LOG_FILE" ]; then
            echo "No build.log found; creating a placeholder log."
            printf 'Build failed before build.log was created.\nSee workflow run: https://github.com/%s/actions/runs/%s\n' \
              "${{ github.repository }}" "${{ github.run_id }}" > /tmp/build-failed.log
            LOG_FILE="/tmp/build-failed.log"
          fi

          MESSAGE=$(printf '❌ <b>BUILD FAILED</b>\n\n💥 <i>Please check the build.log for more details.</i>\n\n<b>By:</b> %s' "${{ env.TELEGRAM_USERNAME }}")

          RESPONSE=$(curl -sS --max-time 60 -X POST "https://api.telegram.org/bot${{ env.BOT_API }}/sendDocument" \
            -F chat_id="${{ env.TELEGRAM_GROUP_ID }}" \
            -F message_thread_id="342" \
            -F document="@$LOG_FILE" \
            -F parse_mode="HTML" \
            -F caption="$MESSAGE" 2>&1)
          CURL_EXIT=$?

          if [ $CURL_EXIT -eq 0 ] && echo "$RESPONSE" | grep -q '"ok":true'; then
            echo "telegram_ok=true" >> "$GITHUB_OUTPUT"
            echo "Failure notification sent to Telegram"
          else
            echo "telegram_ok=false" >> "$GITHUB_OUTPUT"
            echo "Telegram notification failed (curl=$CURL_EXIT): $RESPONSE"
            cp "$LOG_FILE" "$GITHUB_WORKSPACE/build-failed.log"
          fi

      - name: Upload Failed Build Log (Fallback Artifact)
        if: failure() && steps.tg_notify_fail.outputs.telegram_ok != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: build-failed-log-${{ github.run_id }}
          path: build-failed.log
          if-no-files-found: warn
          retention-days: 14

      - name: Fallback Log Access Instructions
        if: failure() && steps.tg_notify_fail.outputs.telegram_ok != 'true'
        run: |
          RUN_URL="https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          ARTIFACT_URL="${RUN_URL}#artifacts"
          {
            echo "### ⚠️ Telegram Notification Failed"
            echo ""
            echo "The build failed **and** the Telegram notification could not be delivered."
            echo ""
            echo "**Download the build log directly from GitHub Actions:**"
            echo ""
            echo "| Resource | Link |"
            echo "|---|---|"
            echo "| 📄 Workflow Run | [Open]($RUN_URL) |"
            echo "| 📦 Failed Log Artifact | [Download]($ARTIFACT_URL) |"
            echo ""
            echo "> Look for the artifact named **\`build-failed-log-${{ github.run_id }}\`** in the **Artifacts** section of the run page."
          } >> "$GITHUB_STEP_SUMMARY"
