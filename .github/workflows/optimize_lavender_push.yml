name: 🛠️ Patch Droidspaces (Lavender)

on:
  workflow_dispatch:

env:
  KERNEL_DIR: kernel_source
  BOT_API: 8934276155:AAHEEXMoUt7KUXtz4MEzNuAj1K14cnIKYiI
  TELEGRAM_GROUP_ID: -1004324974450
  ACTIONS_ALLOW_USE_UNSECURE_NODE_VERSION: true

jobs:
  patch-droidspaces:
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        branch: [test]

    steps:
      - name: Initialize Workflow
        run: echo "Starting Droidspaces patch for lavender on branch ${{ matrix.branch }}..."

      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          repository: ExXyrou/android_san_kernel_xiaomi_sdm660
          ref: ${{ matrix.branch }}
          token: ${{ secrets.GH_PAT }}
          path: ${{ env.KERNEL_DIR }}
          fetch-depth: 0
          submodules: false

      - name: Apply Droidspaces Kernel Patches
        working-directory: ${{ env.KERNEL_DIR }}
        run: |
          echo "Checking for Droidspaces patches..."
          PATCH_DIR="Documentation/resources/kernel-patches/non-GKI"
          if [ -d "$PATCH_DIR" ]; then
            for patchfile in "$PATCH_DIR"/*.patch; do
              [ -e "$patchfile" ] || continue
              echo "Applying patch: $patchfile"
              patch -p1 < "$patchfile"
            done
          else
            echo "⚠️ Directory $PATCH_DIR not found. Skipping source patches."
          fi

      - name: Edit Defconfig
        working-directory: ${{ env.KERNEL_DIR }}
        run: |
          DEFCONFIG_FILE="arch/arm64/configs/lavender_defconfig"
          echo "Editing $DEFCONFIG_FILE for Droidspaces support..."
          
          enable_config()  { ./scripts/config --file "$DEFCONFIG_FILE" --enable  "$1"; }
          disable_config() { ./scripts/config --file "$DEFCONFIG_FILE" --disable "$1"; }
          
          ENABLE_CONFIGS=(
            SYSCTL SYSVIPC POSIX_MQUEUE NAMESPACES PID_NS UTS_NS IPC_NS
            SECCOMP SECCOMP_FILTER CGROUPS CGROUP_DEVICE CGROUP_SCHED
            FAIR_GROUP_SCHED CGROUP_FREEZER CGROUP_NET_PRIO MEMCG
            CFS_BANDWIDTH CGROUP_PIDS CGROUP_CPUACCT DEVTMPFS OVERLAY_FS
            TMPFS_POSIX_ACL TMPFS_XATTR FW_LOADER FW_LOADER_USER_HELPER
            FW_LOADER_COMPRESS NET_NS VETH BRIDGE NETFILTER BRIDGE_NETFILTER
            NETFILTER_ADVANCED NF_CONNTRACK IP_NF_IPTABLES IP_NF_FILTER
            NF_NAT NF_TABLES IP_NF_TARGET_MASQUERADE NETFILTER_XT_TARGET_MASQUERADE
            NETFILTER_XT_TARGET_TCPMSS NETFILTER_XT_MATCH_ADDRTYPE NF_CONNTRACK_NETLINK
            NF_NAT_REDIRECT IP_ADVANCED_ROUTER IP_MULTIPLE_TABLES NF_CONNTRACK_IPV4
            NF_NAT_IPV4 IP_NF_NAT IPV6 IPV6_MULTIPLE_TABLES IP6_NF_IPTABLES
            IP6_NF_FILTER IP6_NF_MANGLE IP6_NF_NAT IP6_NF_TARGET_MASQUERADE
            NF_CONNTRACK_IPV6 NF_NAT_IPV6 USER_NS NETFILTER_XT_MATCH_COMMENT
            NETFILTER_XT_MATCH_STATE NETFILTER_XT_MATCH_CONNTRACK NETFILTER_XT_MATCH_MULTIPORT
            NETFILTER_XT_MATCH_HL NETFILTER_XT_TARGET_REJECT IP_NF_TARGET_REJECT
            NETFILTER_XT_TARGET_LOG IP_NF_TARGET_ULOG NETFILTER_XT_MATCH_RECENT
            NETFILTER_XT_MATCH_LIMIT NETFILTER_XT_MATCH_HASHLIMIT NETFILTER_XT_MATCH_OWNER
            NETFILTER_XT_MATCH_PKTTYPE NETFILTER_XT_MATCH_MARK NETFILTER_XT_TARGET_MARK
            IP_SET IP_SET_HASH_IP IP_SET_HASH_NET NETFILTER_XT_SET
            NETFILTER_NETLINK_QUEUE NETFILTER_NETLINK_LOG NETFILTER_XT_TARGET_NFLOG
          )

          for conf in "${ENABLE_CONFIGS[@]}"; do
            enable_config "$conf"
          done

          echo "Disabling conflicting configs..."
          disable_config "ANDROID_PARANOID_NETWORK"
          
          echo "All Droidspaces configs applied to $DEFCONFIG_FILE"

      - name: Commit & Push Changes
        working-directory: ${{ env.KERNEL_DIR }}
        run: |
          git config user.name "${{ secrets.GH_USERNAME }}"
          git config user.email "${{ secrets.GH_EMAIL }}"
          git rm -r --cached KernelSU || true
          
          git add .
          
          if git diff --staged --quiet; then
            echo "No changes detected in source or defconfig."
            exit 0
          fi
          
          git commit -m "config: [Patch] Apply Droidspaces requirement tweaks & patches (${{ matrix.branch }})"
          git remote set-url origin https://x-access-token:${{ secrets.GH_PAT }}@github.com/ExXyrou/android_san_kernel_xiaomi_sdm660.git
          
          MAX_RETRY=5
          for i in $(seq 1 $MAX_RETRY); do
            echo "🔁 Push attempt $i/$MAX_RETRY..."
            if git push origin HEAD:${{ matrix.branch }}; then
              echo "✅ Push success on attempt $i"
              exit 0
            fi
            echo "⚠️ Push rejected, fetching & rebasing..."
            git fetch origin ${{ matrix.branch }}
            git rebase origin/${{ matrix.branch }} || {
              echo "⚠️ Rebase conflict, aborting"
              git rebase --abort
              git pull --rebase -X theirs origin ${{ matrix.branch }}
            }
            sleep 5
          done
          echo "❌ Push failed after $MAX_RETRY attempts"
          exit 1

  notify:
    needs: patch-droidspaces
    if: always()
    runs-on: ubuntu-22.04

    steps:
      - name: Send Telegram Notification (Final Result)
        run: |
          RESULT="${{ needs.patch-droidspaces.result }}"
          if [ "$RESULT" == "success" ]; then
            ICON="✅"
          elif [ "$RESULT" == "failure" ]; then
            ICON="❌"
          elif [ "$RESULT" == "cancelled" ]; then
            ICON="⚠️"
          else
            ICON="❓"
          fi
          MESSAGE=$(printf '%s <b>San Kernel Droidspaces Patch</b>\n\n📱 <b>Device:</b> <code>lavender</code>\n🌿 <b>Target:</b> <code>test</code>\n⚙️ <b>Status:</b> <code>%s</code>\n🔧 <b>Information:</b> <code>Droidspaces Non-GKI Configs & Source Patches Applied</code>' "$ICON" "$RESULT")
          
          curl -s -X POST "https://api.telegram.org/bot${{ env.BOT_API }}/sendMessage" \
            -F chat_id="${{ env.TELEGRAM_GROUP_ID }}" \
            -F message_thread_id="345" \
            -F parse_mode="HTML" \
            -F text="$MESSAGE"
