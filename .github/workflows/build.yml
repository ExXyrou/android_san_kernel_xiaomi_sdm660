name: 🛠️ Build Kernel

on:
  workflow_dispatch:
    inputs:
      DEVICE:
        description: '📱 Select Device'
        required: true
        default: 'lavender'
        type: choice
        options:
          - lavender
          - whyred
      KERNEL_BRANCH:
        description: '🌿 Select Kernel Branch'
        required: true
        default: 'PLTS'
        type: choice
        options:
          - PLTS
          - st74
          - st78
          - ksun-33024
          - ksun-33068
          - resukisu
          - susfs
      LOCALVERSION:
        description: '🏷️ Custom Kernel Name (e.g., MyKernel-v1.0)'
        required: true
        type: string
      LOCALVERSION_AUTO:
        description: '🔧 Enable Localversion Auto'
        required: true
        default: false
        type: boolean
      QTI_HAPTICS:
        description: '📳 Include QTI Haptics Support'
        required: true
        default: false
        type: boolean
      BUILD_NEWCAM:
        description: '📷 Use Newcam Build'
        required: true
        default: false
        type: boolean
      INJECT_KSU:
        description: '🦊 Inject KernelSU (backslashxx)'
        required: true
        default: false
        type: boolean
      INJECT_DROIDSPACES:
        description: '👾 Inject Droidspaces Patch & Configs'
        required: true
        default: false
        type: boolean
      COMPILER:
        description: '🛠️ Select Compiler'
        required: true
        default: 'zyc'
        type: choice
        options:
          - zyc
          - proton
      ADD_AROMA_INSTALLER:
        description: '⚙️ Add Aroma Installer'
        required: true
        default: false
        type: boolean

env:
  TELEGRAM_USERNAME: '@exxyrou'
  KERNEL_DIR: kernel_source
  CLANG_DIR: clang
  OUT_DIR: out
  ARCH: arm64
  SUBARCH: arm64
  KERNEL_URL: https://github.com/ExXyrou/android_san_kernel_xiaomi_sdm660.git
  DEFAULT_HOSTNAME: xiaomi@redmi
  BUILD_USER: xiaomi
  BUILD_HOST: redmi
  BOT_API: 8934276155:AAHEEXMoUt7KUXtz4MEzNuAj1K14cnIKYiI
  TELEGRAM_GROUP_ID: -1004324974450
  ACTIONS_ALLOW_USE_UNSECURE_NODE_VERSION: true

jobs:
  build:
    runs-on: ubuntu-22.04
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Initialize Build Environment
        run: echo "BUILD_START_TIME=$(date +%s)" >> $GITHUB_ENV

      - name: Clone Kernel Source
        run: |
          rm -rf "${{ env.KERNEL_DIR }}"
          git clone --depth=1 -b "${{ inputs.KERNEL_BRANCH }}" "${{ env.KERNEL_URL }}" "${{ env.KERNEL_DIR }}"
          
      - name: Apply Droidspaces Source Patches
        if: ${{ inputs.INJECT_DROIDSPACES == true }}
        working-directory: ${{ env.KERNEL_DIR }}
        run: |
          PATCH_DIR="Documentation/resources/kernel-patches/non-GKI"
          echo "Checking for Droidspaces patches in $PATCH_DIR..."
          if [ -d "$PATCH_DIR" ]; then
            for patchfile in "$PATCH_DIR"/*.patch; do
              [ -e "$patchfile" ] || continue
              echo "Applying: $patchfile"
              patch -p1 < "$patchfile"
            done
          else
            echo "⚠️ Directory $PATCH_DIR not found. Skipping source patches."
          fi

      - name: Configure Kernel Version & Strings
        working-directory: ${{ env.KERNEL_DIR }}
        run: |
          CLEAN_INPUT=$(echo "${{ inputs.LOCALVERSION }}" | sed 's/^-//')
          
          if [ -n "$CLEAN_INPUT" ]; then
            FINAL_LOCAL="-${CLEAN_INPUT}"
          else
            FINAL_LOCAL=""
          fi
          
          echo "KERNEL_NAME_STRING=$FINAL_LOCAL" >> $GITHUB_ENV
          echo "Kernel string configured: $FINAL_LOCAL"
          KVER_MAJOR=$(grep -m1 '^VERSION =' Makefile | tr -d ' ' | cut -d'=' -f2)
          KVER_PATCH=$(grep -m1 '^PATCHLEVEL =' Makefile | tr -d ' ' | cut -d'=' -f2)
          KVER_SUB=$(grep -m1 '^SUBLEVEL =' Makefile | tr -d ' ' | cut -d'=' -f2)
          FULL_KVER="${KVER_MAJOR}.${KVER_PATCH}.${KVER_SUB}"
          echo "KERNEL_VERSION=$FULL_KVER" >> $GITHUB_ENV
          echo "Detected version: $FULL_KVER"
          
      - name: Install Build Dependencies
        timeout-minutes: 10
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          while sudo fuser /var/lib/dpkg/lock-frontend >/dev/null 2>&1; do sleep 5; done
          for i in 1 2 3; do sudo apt-get update -yq && break; sleep 10; done
          sudo apt-get install -yq --no-install-recommends \
            -o Acquire::Retries=3 \
            bc bison libssl-dev libelf-dev build-essential python3 python3-pip curl git zip unzip wget ccache libncurses-dev rsync gcc-aarch64-linux-gnu binutils-aarch64-linux-gnu gcc-arm-linux-gnueabi binutils-arm-linux-gnueabi xz-utils
            
      - name: Setup Compiler Cache
        uses: actions/cache@v4
        with:
          path: ~/.ccache
          key: ccache-${{ inputs.DEVICE }}-${{ inputs.COMPILER }}-${{ github.run_id }}
          restore-keys: |
            ccache-${{ inputs.DEVICE }}-${{ inputs.COMPILER }}-
            
      - name: Setup KernelSU
        if: ${{ inputs.INJECT_KSU == true }}
        working-directory: ${{ env.KERNEL_DIR }}
        run: |
          curl -LSs "https://raw.githubusercontent.com/backslashxx/KernelSU/refs/heads/master/kernel/setup.sh" | bash -s master
          
      - name: Setup Clang Toolchain Cache
        id: clang-cache
        uses: actions/cache@v4
        with:
          path: ${{ env.CLANG_DIR }}
          key: clang-${{ inputs.COMPILER }}-v1-${{ hashFiles('.github/workflows/*.yml') }}

      - name: Download & Setup Clang Toolchain
        if: steps.clang-cache.outputs.cache-hit != 'true'
        run: |
          mkdir -p "$CLANG_DIR"
          
          if [ "${{ inputs.COMPILER }}" == "zyc" ]; then
            echo "Downloading latest ZyC Clang..."
            CLANG_URL=$(curl -s https://api.github.com/repos/ZyCromerZ/Clang/releases/latest | grep "browser_download_url" | grep -i "tar.gz" | grep -v "arm64" | cut -d '"' -f 4 | head -n 1)
            if [ -z "$CLANG_URL" ]; then
              echo "Error: ZyC Clang URL not found or format changed!"
              exit 1
            fi
            curl -LSs "$CLANG_URL" -o zyc_clang.tar.gz
            tar -zxf zyc_clang.tar.gz -C "$CLANG_DIR" && rm -f zyc_clang.tar.gz
            
            if [ ! -d "$CLANG_DIR/bin" ]; then
              CLANG_SUBDIR=$(find "$CLANG_DIR" -mindepth 1 -maxdepth 1 -type d | head -n 1)
              [ -n "$CLANG_SUBDIR" ] && mv "$CLANG_SUBDIR"/* "$CLANG_DIR/"
            fi
            echo "CLANG_DISPLAY_VERSION=ZyC Clang 15.0.7" >> $GITHUB_ENV
          elif [ "${{ inputs.COMPILER }}" == "proton" ]; then
            echo "Cloning Proton Clang..."
            rm -rf "$CLANG_DIR"
            git clone --depth=1 https://github.com/kdrag0n/proton-clang.git "$CLANG_DIR"
            echo "CLANG_DISPLAY_VERSION=Proton Clang 13.0.0" >> $GITHUB_ENV
          fi
          
      - name: Ensure Clang Version Variable
        run: |
          if [ -z "${{ env.CLANG_DISPLAY_VERSION }}" ]; then
            if [ "${{ inputs.COMPILER }}" == "zyc" ]; then
              echo "CLANG_DISPLAY_VERSION=ZyC Clang 15.0.7" >> $GITHUB_ENV
            else
              echo "CLANG_DISPLAY_VERSION=Proton Clang 13.0.0" >> $GITHUB_ENV
            fi
          fi
          
      - name: Prepare Configs & Build Options
        working-directory: ${{ env.KERNEL_DIR }}
        run: |
          [ -f kernel/sched/sched.h ] && sed -i 's/cpu_rq(cpu)->cfs->cumulative_runnable_avg/cpu_rq(cpu)->cfs.cumulative_runnable_avg/g' kernel/sched/sched.h
          
          if [ "${{ inputs.DEVICE }}" == "whyred" ]; then
            DEFCONFIG="whyred_defconfig"
          else
            DEFCONFIG="lavender_defconfig"
          fi
          
          export PATH="$GITHUB_WORKSPACE/$CLANG_DIR/bin:$PATH"
          make O=$OUT_DIR ARCH=${{ env.ARCH }} CC="$GITHUB_WORKSPACE/$CLANG_DIR/bin/clang" CLANG_TRIPLE=aarch64-linux-gnu- CROSS_COMPILE=aarch64-linux-gnu- CROSS_COMPILE_ARM32=arm-linux-gnueabi- $DEFCONFIG
          enable_config() { ./scripts/config --file "$OUT_DIR/.config" --enable "$1"; }
          disable_config() { ./scripts/config --file "$OUT_DIR/.config" --disable "$1"; }
          set_str() { ./scripts/config --file "$OUT_DIR/.config" --set-str "$1" "$2"; }
          
          set_str CONFIG_DEFAULT_HOSTNAME "${{ env.DEFAULT_HOSTNAME }}"
          set_str CONFIG_LOCALVERSION "${{ env.KERNEL_NAME_STRING }}"
          
          if [ "${{ inputs.LOCALVERSION_AUTO }}" == "true" ]; then
            enable_config CONFIG_LOCALVERSION_AUTO
            git config --global --add safe.directory "$PWD"
            git update-index --assume-unchanged $(git ls-files) || true
          else
            disable_config CONFIG_LOCALVERSION_AUTO
          fi
          
          if [ "${{ inputs.ADD_AROMA_INSTALLER }}" == "true" ]; then
            disable_config CONFIG_KERNEL_GZIP && enable_config CONFIG_KERNEL_XZ
            enable_config CONFIG_RD_XZ
            sed -i 's/CONFIG_BUILD_ARM64_APPENDED_KERNEL_IMAGE_NAME="Image.gz-dtb"/CONFIG_BUILD_ARM64_APPENDED_KERNEL_IMAGE_NAME="Image.xz"/g' "$OUT_DIR/.config"
            echo "MAKE_TARGET=" >> $GITHUB_ENV
          else
            enable_config CONFIG_KERNEL_GZIP && disable_config CONFIG_KERNEL_XZ
            disable_config CONFIG_RD_XZ
            sed -i 's/CONFIG_BUILD_ARM64_APPENDED_KERNEL_IMAGE_NAME="Image.xz"/CONFIG_BUILD_ARM64_APPENDED_KERNEL_IMAGE_NAME="Image.gz-dtb"/g' "$OUT_DIR/.config"
            echo "MAKE_TARGET=Image.gz-dtb" >> $GITHUB_ENV
          fi
          
          [ "${{ inputs.QTI_HAPTICS }}" == "true" ] && enable_config CONFIG_INPUT_QTI_HAPTICS
          [ "${{ inputs.BUILD_NEWCAM }}" == "true" ] && enable_config CONFIG_XIAOMI_NEW_CAMERA_BLOBS
          
          if [ "${{ inputs.INJECT_KSU }}" == "true" ]; then
            enable_config CONFIG_KSU
            enable_config CONFIG_KSU_TAMPER_SYSCALL_TABLE
          fi
          
          if [ "${{ inputs.INJECT_DROIDSPACES }}" == "true" ]; then
            echo "Injecting Droidspaces mandatory & firewall configs directly to .config..."
            
            DS_CONFIGS=(
              EXPERT SYSCTL SYSVIPC SYSVIPC_SYSCTL POSIX_MQUEUE NAMESPACES PID_NS UTS_NS IPC_NS
              SECCOMP SECCOMP_FILTER CGROUPS CGROUP_DEVICE CGROUP_SCHED FAIR_GROUP_SCHED
              CGROUP_FREEZER CGROUP_NET_PRIO MEMCG CFS_BANDWIDTH CGROUP_PIDS CGROUP_CPUACCT
              DEVTMPFS OVERLAY_FS TMPFS_POSIX_ACL TMPFS_XATTR FW_LOADER FW_LOADER_USER_HELPER
              FW_LOADER_COMPRESS NET_NS VETH BRIDGE NETFILTER BRIDGE_NETFILTER NETFILTER_ADVANCED
              NF_CONNTRACK IP_NF_IPTABLES IP_NF_FILTER NF_NAT NF_TABLES IP_NF_TARGET_MASQUERADE
              NETFILTER_XT_TARGET_MASQUERADE NETFILTER_XT_TARGET_TCPMSS NETFILTER_XT_MATCH_ADDRTYPE
              NF_CONNTRACK_NETLINK NF_NAT_REDIRECT IP_ADVANCED_ROUTER IP_MULTIPLE_TABLES
              NF_CONNTRACK_IPV4 NF_NAT_IPV4 IP_NF_NAT IPV6 IPV6_MULTIPLE_TABLES IP6_NF_IPTABLES
              IP6_NF_FILTER IP6_NF_MANGLE IP6_NF_NAT IP6_NF_TARGET_MASQUERADE NF_CONNTRACK_IPV6
              NF_NAT_IPV6 USER_NS NETFILTER_XT_MATCH_COMMENT NETFILTER_XT_MATCH_STATE
              NETFILTER_XT_MATCH_CONNTRACK NETFILTER_XT_MATCH_MULTIPORT NETFILTER_XT_MATCH_HL
              NETFILTER_XT_TARGET_REJECT IP_NF_TARGET_REJECT NETFILTER_XT_TARGET_LOG
              IP_NF_TARGET_ULOG NETFILTER_XT_MATCH_RECENT NETFILTER_XT_MATCH_LIMIT
              NETFILTER_XT_MATCH_HASHLIMIT NETFILTER_XT_MATCH_OWNER NETFILTER_XT_MATCH_PKTTYPE
              NETFILTER_XT_MATCH_MARK NETFILTER_XT_TARGET_MARK IP_SET IP_SET_HASH_IP
              IP_SET_HASH_NET NETFILTER_XT_SET NETFILTER_NETLINK_QUEUE NETFILTER_NETLINK_LOG
              NETFILTER_XT_TARGET_NFLOG TUN
            )
            
            for conf in "${DS_CONFIGS[@]}"; do
              enable_config "$conf"
            done
            
            disable_config ANDROID_PARANOID_NETWORK
            echo "Droidspaces configs injected successfully."
          fi
          
          make O=$OUT_DIR ARCH=${{ env.ARCH }} CC="$GITHUB_WORKSPACE/$CLANG_DIR/bin/clang" CLANG_TRIPLE=aarch64-linux-gnu- CROSS_COMPILE=aarch64-linux-gnu- CROSS_COMPILE_ARM32=arm-linux-gnueabi- olddefconfig
          
      - name: Build Kernel
        working-directory: ${{ env.KERNEL_DIR }}
        run: |
          export PATH="/usr/lib/ccache:$GITHUB_WORKSPACE/$CLANG_DIR/bin:$PATH"
          export KBUILD_BUILD_USER="${{ env.BUILD_USER }}"
          export KBUILD_BUILD_HOST="${{ env.BUILD_HOST }}"
          
          export KBUILD_BUILD_TIMESTAMP="$(TZ=UTC date)"
          
          make -j$(nproc --all) O=$OUT_DIR ARCH=${{ env.ARCH }} \
            CC="ccache $GITHUB_WORKSPACE/$CLANG_DIR/bin/clang" \
            HOSTCC="ccache $GITHUB_WORKSPACE/$CLANG_DIR/bin/clang" \
            HOSTCXX="ccache $GITHUB_WORKSPACE/$CLANG_DIR/bin/clang++" \
            AR="$GITHUB_WORKSPACE/$CLANG_DIR/bin/llvm-ar" \
            NM="$GITHUB_WORKSPACE/$CLANG_DIR/bin/llvm-nm" \
            OBJCOPY="$GITHUB_WORKSPACE/$CLANG_DIR/bin/llvm-objcopy" \
            OBJDUMP="$GITHUB_WORKSPACE/$CLANG_DIR/bin/llvm-objdump" \
            STRIP="$GITHUB_WORKSPACE/$CLANG_DIR/bin/llvm-strip" \
            CLANG_TRIPLE=aarch64-linux-gnu- \
            CROSS_COMPILE=aarch64-linux-gnu- \
            CROSS_COMPILE_ARM32=arm-linux-gnueabi- \
            KCFLAGS="-Wno-address -Wno-implicit-function-declaration" \
            ${{ env.MAKE_TARGET }} 2>&1 | tee build.log
            
          if ! find "$OUT_DIR/arch/arm64/boot" -maxdepth 1 -name "Image*" | grep -q .; then
            echo "Error: Kernel output image not found!"
            exit 1
          fi
          
      - name: Package Kernel Zip & KSU Managers
        id: img
        working-directory: ${{ env.KERNEL_DIR }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "${{ inputs.ADD_AROMA_INSTALLER }}" == "true" ]; then
            BRANCH_NAME="san-kernel"
            OUTPUT_NAME="Image.xz"
            IMAGE=$(find "$PWD/$OUT_DIR/arch/arm64/boot" -type f \( -name "Image.gz-dtb" -o -name "Image.gz" -o -name "Image.xz" -o -name "Image" \) | head -n1)
            
            if [[ "$IMAGE" == *.xz ]]; then
              cp "$IMAGE" "$GITHUB_WORKSPACE/$OUTPUT_NAME"
            else
              xz -f -k -c "$IMAGE" > "$GITHUB_WORKSPACE/$OUTPUT_NAME"
            fi
          else
            BRANCH_NAME="original"
            OUTPUT_NAME="Image.gz-dtb"
            IMAGE=$(find "$PWD/$OUT_DIR/arch/arm64/boot" -name "Image.gz-dtb" 2>/dev/null | head -n1)
            cp "$IMAGE" "$GITHUB_WORKSPACE/$OUTPUT_NAME"
          fi
          
          cd "$GITHUB_WORKSPACE"
          git clone --depth=1 -b "$BRANCH_NAME" https://github.com/ExXyrou/AnyKernel3 AnyKernel3
          cp "$GITHUB_WORKSPACE/$OUTPUT_NAME" AnyKernel3/
          
          cd AnyKernel3
          if [ -f anykernel.sh ]; then
            if [ "${{ inputs.ADD_AROMA_INSTALLER }}" == "true" ]; then
              sed -i 's/Image\.gz-dtb/Image.xz/g; s/Image\.gz/Image.xz/g; s/Image$/Image.xz/g' anykernel.sh
            else
              sed -i 's/Image\.xz/Image.gz-dtb/g' anykernel.sh
            fi
            grep -q "kernel_name=" anykernel.sh && sed -i "s/^kernel_name=.*/kernel_name=\"$OUTPUT_NAME\"/" anykernel.sh
          fi
          
          FINAL_LOCALVER=$(echo "${{ env.KERNEL_NAME_STRING }}" | sed 's/^-//')
          sed -i -E 's/^(kernel\.string=).*/\1'"$FINAL_LOCALVER"'/' anykernel.sh
          sed -i "s/^device\.name1=.*/device.name1=${{ inputs.DEVICE }}/" anykernel.sh
          
          ZIP_NAME="${{ inputs.DEVICE }}-${{ env.KERNEL_VERSION }}${{ env.KERNEL_NAME_STRING }}-$(date +'%Y%d%m').zip"
          zip -r9 "$ZIP_NAME" * -x ".git/*"
          
          cd "$GITHUB_WORKSPACE"
          mkdir -p ksu_managers
          HAS_KSU=false
          
          if [ "${{ inputs.KERNEL_BRANCH }}" == "ksun-33024" ]; then
            gh release download ksun-33024 -R ExXyrou/KernelSU_Manager -p "*.apk" -D ksu_managers
            HAS_KSU=true
          elif [ "${{ inputs.KERNEL_BRANCH }}" == "ksun-33068" ]; then
            gh release download ksun-33068 -R ExXyrou/KernelSU_Manager -p "*.apk" -D ksu_managers
            HAS_KSU=true
          elif [ "${{ inputs.KERNEL_BRANCH }}" == "resukisu" ]; then
            gh release download resukisu-34681 -R ExXyrou/KernelSU_Manager -p "*.apk" -D ksu_managers
            HAS_KSU=true
          elif [ "${{ inputs.KERNEL_BRANCH }}" == "susfs" ]; then
            gh release download resukisu-susfs-35107 -R ExXyrou/KernelSU_Manager -p "*.apk" -D ksu_managers
            HAS_KSU=true
          elif [ "${{ inputs.INJECT_KSU }}" == "true" ]; then
            gh release download -R backslashxx/KernelSU -p "*.apk" -D ksu_managers
            mv ksu_managers/*.apk ksu_managers/manager.apk
            HAS_KSU=true
          fi
          
          if [ "$HAS_KSU" == "true" ]; then
            FINAL_BUNDLE="Bundle_${ZIP_NAME}"
            zip -j -9 "$FINAL_BUNDLE" AnyKernel3/"$ZIP_NAME" ksu_managers/*.apk
            echo "zip_path=$GITHUB_WORKSPACE/$FINAL_BUNDLE" >> "$GITHUB_OUTPUT"
          else
            echo "zip_path=$GITHUB_WORKSPACE/AnyKernel3/$ZIP_NAME" >> "$GITHUB_OUTPUT"
          fi
          
      - name: Send Telegram Notification (Success)
        if: success()
        run: |
          CAM_TYPE=$([ "${{ inputs.BUILD_NEWCAM }}" == "true" ] && echo "newcam" || echo "oldcam")
          DS_TEXT=$([ "${{ inputs.INJECT_DROIDSPACES }}" == "true" ] && echo "supported" || echo "none")
          AROMA_TEXT=$([ "${{ inputs.ADD_AROMA_INSTALLER }}" == "true" ] && echo "yes" || echo "none")
          
          if [ "${{ inputs.KERNEL_BRANCH }}" == "ksun-33024" ]; then
            KSU_TEXT='<code>ksun-33024</code>'
          elif [ "${{ inputs.KERNEL_BRANCH }}" == "ksun-33068" ]; then
            KSU_TEXT='<code>ksun-33068</code>'
          elif [ "${{ inputs.KERNEL_BRANCH }}" == "resukisu" ]; then
            KSU_TEXT='<code>resukisu</code>'
          elif [ "${{ inputs.KERNEL_BRANCH }}" == "susfs" ]; then
            KSU_TEXT='<code>susfs</code>'
          elif [ "${{ inputs.INJECT_KSU }}" == "true" ]; then
            KSU_TEXT='<code>xxksu</code>'
          else
            KSU_TEXT='<code>none</code>'
          fi
          
          if [ "${{ inputs.QTI_HAPTICS }}" == "true" ]; then
            KERNEL_TYPE="EAS-QTI"
            QTI_LINE=$'\n'$(printf '📳 <b>QTI Haptics:</b> <code>%s</code>' "${{ inputs.QTI_HAPTICS }}")
            THREAD_ID="472"
          else
            KERNEL_TYPE="EAS"
            QTI_LINE=""
            THREAD_ID="336"
          fi
          
          MESSAGE=$(printf '📱 <b>Device:</b> <code>%s</code>\n🏷️ <b>Kernel Name:</b> <code>%s%s</code>\n⚙️ <b>Kernel Type:</b> <code>%s</code>\n📷 <b>Build Type:</b> <code>%s</code>%s\n🦊 <b>KSU:</b> %s\n👾 <b>Droidspaces:</b> <code>%s</code>\n🛠️ <b>Clang Compiler:</b> <code>%s</code>\n⚙️ <b>Aroma Installer:</b> <code>%s</code>\n\n<b>By:</b> %s' "${{ inputs.DEVICE }}" "${{ env.KERNEL_VERSION }}" "${{ env.KERNEL_NAME_STRING }}" "$KERNEL_TYPE" "$CAM_TYPE" "$QTI_LINE" "$KSU_TEXT" "$DS_TEXT" "${{ env.CLANG_DISPLAY_VERSION }}" "$AROMA_TEXT" "${{ env.TELEGRAM_USERNAME }}")
          
          curl -s -X POST "https://api.telegram.org/bot${{ env.BOT_API }}/sendDocument" \
            -F chat_id="${{ env.TELEGRAM_GROUP_ID }}" \
            -F message_thread_id="$THREAD_ID" \
            -F document="@${{ steps.img.outputs.zip_path }}" \
            -F parse_mode="HTML" \
            -F caption="$MESSAGE"
            
      - name: Send Telegram Notification (Failure)
        if: failure()
        run: |
          MESSAGE=$(printf '❌ <b>BUILD FAILED</b>\n\n💥 <i>Check build.log for details.</i>\n\n<b>By:</b> %s' "${{ env.TELEGRAM_USERNAME }}")
          
          curl -s -X POST "https://api.telegram.org/bot${{ env.BOT_API }}/sendDocument" \
            -F chat_id="${{ env.TELEGRAM_GROUP_ID }}" \
            -F message_thread_id="342" \
            -F document="@${{ env.KERNEL_DIR }}/build.log" \
            -F parse_mode="HTML" \
            -F caption="$MESSAGE"
