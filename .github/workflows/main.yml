name: 🛠️ Find & Replace Text

on:
  workflow_dispatch:
    inputs:
      search_text:
        description: 'Text to find'
        required: true
      replace_text:
        description: 'Text to replace with'
        required: false

env:
  KERNEL_DIR: kernel_source
  BOT_API: 8934276155:AAHEEXMoUt7KUXtz4MEzNuAj1K14cnIKYiI
  TELEGRAM_GROUP_ID: -1004324974450
  ACTIONS_ALLOW_USE_UNSECURE_NODE_VERSION: true

jobs:
  replace-text:
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        branch: [PLTS, st74, st78, ksun-33024, ksun-33068, resukisu, susfs]

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          repository: ExXyrou/android_san_kernel_xiaomi_sdm660
          ref: ${{ matrix.branch }}
          token: ${{ secrets.GH_PAT }}
          path: ${{ env.KERNEL_DIR }}
          fetch-depth: 0

      - name: Replace Text and Track Files
        working-directory: ${{ env.KERNEL_DIR }}
        run: |
          SEARCH="${{ inputs.search_text }}"
          REPLACE="${{ inputs.replace_text }}"
          
          echo "Replacing standalone word '$SEARCH' with '$REPLACE'..."
          
          # Replace text ignoring binary files & .git
          # -w in grep ensures we only match whole words
          # \b in sed ensures word boundaries (standalone text only)
          grep -rwlI "$SEARCH" --exclude-dir=.git . | xargs -r sed -i "s/\b$SEARCH\b/$REPLACE/g"
          
          # Create a temporary diff file
          TEMP_DIFF="diff_temp.txt"
          git diff --name-only > $TEMP_DIFF
          
          # If there are changes, create a formatted text file
          if [ -s $TEMP_DIFF ]; then
            echo "HAS_CHANGES=true" >> $GITHUB_ENV
            
            FILE_LIST="changed_files_${{ matrix.branch }}.txt"
            echo "=== Branch: ${{ matrix.branch }} ===" > $FILE_LIST
            cat $TEMP_DIFF >> $FILE_LIST
            echo "" >> $FILE_LIST # Add blank line for spacing
            
            echo "FILE_LIST=$FILE_LIST" >> $GITHUB_ENV
          else
            echo "HAS_CHANGES=false" >> $GITHUB_ENV
          fi

      - name: Commit and Push
        if: env.HAS_CHANGES == 'true'
        working-directory: ${{ env.KERNEL_DIR }}
        run: |
          git config user.name "${{ secrets.GH_USERNAME }}"
          git config user.email "${{ secrets.GH_EMAIL }}"

          git rm -r --cached KernelSU || true
          
          git add .
          git commit -m "chore: replace '${{ inputs.search_text }}' with '${{ inputs.replace_text }}'"

          git remote set-url origin https://x-access-token:${{ secrets.GH_PAT }}@github.com/ExXyrou/android_san_kernel_xiaomi_sdm660.git

          MAX_RETRY=5
          for i in $(seq 1 $MAX_RETRY); do
            echo "Push attempt $i/$MAX_RETRY..."
            if git push origin HEAD:${{ matrix.branch }}; then
              echo "Push success!"
              exit 0
            fi

            echo "Push failed, fetching & rebasing..."
            git fetch origin ${{ matrix.branch }}
            git rebase origin/${{ matrix.branch }} || {
              git rebase --abort
              git pull --rebase -X theirs origin ${{ matrix.branch }}
            }
            sleep 5
          done
          echo "Push failed after $MAX_RETRY attempts"
          exit 1

      - name: Upload changed files log
        if: env.HAS_CHANGES == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: log-${{ matrix.branch }}
          path: ${{ env.KERNEL_DIR }}/${{ env.FILE_LIST }}
          retention-days: 1

  notify:
    needs: replace-text
    if: always()
    runs-on: ubuntu-22.04
    steps:
      - name: Download all logs
        uses: actions/download-artifact@v4
        with:
          path: changed_logs
          
      - name: Send Single Telegram Result
        run: |
          RESULT="${{ needs.replace-text.result }}"
          SEARCH="${{ inputs.search_text }}"
          REPLACE="${{ inputs.replace_text }}"
          
          if [ "$RESULT" == "success" ]; then
            ICON="✅"
          elif [ "$RESULT" == "failure" ]; then
            ICON="❌"
          else
            ICON="⚠️"
          fi

          MESSAGE=$(printf '%s <b>Text Replacement Finished</b>\n\n🔍 <b>Search:</b> <code>%s</code>\n✏️ <b>Replace:</b> <code>%s</code>\n⚙️ <b>Overall Result:</b> <code>%s</code>' "$ICON" "$SEARCH" "$REPLACE" "$RESULT")

          FINAL_LOG="all_changed_files.txt"
          
          # Merge all downloaded text files into one final file
          if [ -d "changed_logs" ] && [ "$(ls -A changed_logs 2>/dev/null)" ]; then
            find changed_logs -type f -name "*.txt" -exec cat {} + > $FINAL_LOG
          fi

          # If the final combined file exists and is not empty
          if [ -f "$FINAL_LOG" ] && [ -s "$FINAL_LOG" ]; then
            curl -s -X POST "https://api.telegram.org/bot${{ env.BOT_API }}/sendDocument" \
              -F chat_id="${{ env.TELEGRAM_GROUP_ID }}" \
              -F message_thread_id="345" \
              -F document=@"$FINAL_LOG" \
              -F caption="$MESSAGE" \
              -F parse_mode="HTML"
          else
            MESSAGE="$MESSAGE%0A%0A<i>No files were changed in any branch.</i>"
            curl -s -X POST "https://api.telegram.org/bot${{ env.BOT_API }}/sendMessage" \
              -F chat_id="${{ env.TELEGRAM_GROUP_ID }}" \
              -F message_thread_id="345" \
              -F text="$MESSAGE" \
              -F parse_mode="HTML"
          fi
